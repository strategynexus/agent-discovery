// ============================================================================
// ROOT COMPONENT
// ============================================================================

function App() {
  const [step, setStep] = useState(1);
  const [data, setData] = useState(initialData);
  const [transition, setTransition] = useState(null);

  const update = (patch) => setData(d => ({ ...d, ...patch }));

  const triggerTransition = (label, onComplete, duration = 1200) => {
    setTransition(label);
    setTimeout(() => {
      onComplete();
      setTimeout(() => setTransition(null), 50);
    }, duration);
  };

  const next = () => {
    if (transition) return;

    // Return-to-review: jump back to Step 6 (the review/build/pricing combined step)
    if (data._returnToReview && step < 6) {
      triggerTransition({ title: "Saved.", emoji: "✓", tone: "quick" }, () => {
        setData(d => ({ ...d, _returnToReview: false }));
        setStep(6);
      });
      return;
    }

    // Step 6 (Review) is fully internal — owns its own buttons, no footer next.
    // It calls setStep(7) directly when the consultant confirms.
    // Step 7 (Welcome/Congrats) is the final page — no transition into it from the footer.

    const transitions = {
      1: { emoji: "🏢", title: "Creating your workspace", sub: "Provisioning session" },
      2: { emoji: "🏪", title: `Noted ${data.businessName}`, sub: "Saving business profile" },
      3: { emoji: "🎭", title: `Shaping ${data.agentName}`, sub: "Building personality model" },
      4: { emoji: "🗺️", title: "Assigning work domains", sub: "Mapping responsibilities" },
      5: { emoji: "🔌", title: "Noting your tools", sub: "Recording integrations to set up" },
    };

    const label = transitions[step];

    triggerTransition(label, () => {
      setStep(s => Math.min(7, s + 1));
    });
  };

  const back = () => setStep(s => Math.max(1, s - 1));
  const goTo = (n) => setStep(n);
  const editFromReview = (n) => {
    setData(d => ({ ...d, _returnToReview: true }));
    setStep(n);
  };

  const canContinue = useMemo(() => validateStep(step, data), [step, data]) && !transition;

  return (
    <div className="min-h-screen flex flex-col">
      <Header currentStep={step} goTo={goTo} />
      <main className="flex-1 flex flex-col items-center justify-center py-12 px-6">
        <div key={step} className={`w-full fade-in ${step >= 6 ? "max-w-5xl" : "max-w-2xl"}`}>
          {step === 1 && <Step1 data={data} update={update} />}
          {step === 2 && <Step2 data={data} update={update} />}
          {step === 3 && <Step3 data={data} update={update} />}
          {step === 4 && <Step4Domains data={data} update={update} />}
          {step === 5 && <Step5Tools data={data} update={update} />}
          {step === 6 && <Step6Review data={data} editFromReview={editFromReview} onSubmit={() => setStep(7)} onBack={() => setStep(5)} />}
          {step === 7 && <Step7Welcome data={data} />}
        </div>
      </main>
      {step < 6 && <Footer step={step} canContinue={canContinue} next={next} back={back} returnToReview={data._returnToReview} />}
      {transition && <Transition label={transition} />}
    </div>
  );
}

function Transition({ label }) {
  const isQuick = label.tone === "quick";
  const isExtended = label.extended;
  const findings = [
    "Reading homepage copy",
    "Indexing services",
    "Extracting tone of voice",
    "Pulling team info",
  ];
  const [revealedCount, setRevealedCount] = useState(0);
  useEffect(() => {
    if (!isExtended) return;
    const timers = findings.map((_, i) =>
      setTimeout(() => setRevealedCount(c => c + 1), 350 + i * 350)
    );
    return () => timers.forEach(clearTimeout);
  }, [isExtended]);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center overlay-in" style={{ background: "rgba(247, 243, 234, 0.96)", backdropFilter: "blur(6px)" }}>
      <div className="text-center px-6 max-w-md">
        <div className="relative w-24 h-24 mx-auto mb-6">
          {!isQuick && <div className="absolute inset-0 border-4 border-accent pulse-ring circle"></div>}
          <div className={`absolute inset-0 flex items-center justify-center text-4xl ${isQuick ? "scale-in" : ""}`}>
            {isQuick ? (
              <div className="w-16 h-16 bg-ink border-2 border-ink shadow-brut flex items-center justify-center circle">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#3EB8C8" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                  <polyline className="check-draw" points="5 12 10 17 19 8" />
                </svg>
              </div>
            ) : (
              label.emoji
            )}
          </div>
        </div>
        <div className="label-slide">
          {label.sub && (
            <div className="mono text-xs text-ink/60 uppercase tracking-widest font-semibold mb-2">{label.sub}</div>
          )}
          <div className="display font-black text-xl uppercase text-ink flex items-center justify-center gap-1">
            {label.title}
            {!isQuick && (
              <span className="inline-flex items-center ml-1">
                <span className="w-1.5 h-1.5 bg-ink dot-bounce mx-0.5 circle" style={{ animationDelay: "0s" }}></span>
                <span className="w-1.5 h-1.5 bg-ink dot-bounce mx-0.5 circle" style={{ animationDelay: "0.2s" }}></span>
                <span className="w-1.5 h-1.5 bg-ink dot-bounce mx-0.5 circle" style={{ animationDelay: "0.4s" }}></span>
              </span>
            )}
          </div>
          {isExtended && (
            <div className="mt-6 text-left space-y-1.5 min-h-[120px]">
              {findings.slice(0, revealedCount).map((f, i) => (
                <div key={i} className="flex items-center gap-2 text-sm text-ink/80 fade-in">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3EB8C8" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                    <polyline points="5 12 10 17 19 8" />
                  </svg>
                  <span>{f}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// VALIDATION
// ============================================================================

function validateStep(step, d) {
  switch (step) {
    case 1: return d.email.includes("@") && d.name.length >= 2;
    case 2: return d.businessName.length >= 2 && d.businessWebsite.length >= 4 && d.businessDescription.length >= 20 && d.teamSize && d.agentScope;
    case 3: return d.agentName.length >= 2 && (d.agentEmoji || d.agentChoosesEmoji) && d.agentDescription.length >= 5 && d.communicationStyle;
    case 4: return d.workDomains.length >= 1 && d.priorityDomains.length === Math.min(3, d.workDomains.length);
    case 5: {
      // Validation only counts CORE (non-CRM) integrations — CRMs are add-ons that don't need ranking
      const coreIds = Object.keys(d.integrations).filter(id => {
        const i = INTEGRATIONS.find(x => x.id === id);
        return i && i.category !== "crm";
      });
      if (coreIds.length < 1) return false;
      const requiredPriority = Math.min(3, coreIds.length);
      const corePriorityCount = d.priorityIntegrations.filter(id => coreIds.includes(id)).length;
      return corePriorityCount === requiredPriority;
    }
    // Step 6 is the Review/Confirm page (internal own-button, no footer)
    // Step 7 (Welcome/Congrats) is the final page — no validation, no footer.
    default: return true;
  }
}

          <div className="min-w-0 hidden sm:block">
            <div className="mono text-[10px] text-ink/60 uppercase tracking-widest font-semibold">Agent Discovery</div>
          </div>
        </div>
        <div className="hidden md:flex items-center gap-1.5">
          {STEPS.map(s => (
            <button
              key={s.n}
              onClick={() => s.n < currentStep && goTo(s.n)}
              disabled={s.n >= currentStep}
              className={`h-2 transition-all ${
                s.n === currentStep ? "bg-accent w-8 border border-ink" :
                s.n < currentStep ? "bg-ink w-2 hover:w-5 cursor-pointer" :
                "bg-ink/15 w-2"
              }`}
              aria-label={`Step ${s.n}: ${s.label}`}
            />
          ))}
        </div>
        <div className="mono text-xs text-ink/70 uppercase tracking-widest whitespace-nowrap flex-shrink-0 font-semibold">
          Step {currentStep} / {STEPS.length}
        </div>
      </div>
    </header>
  );
}

function Footer({ step, canContinue, next, back, returnToReview }) {
  const label =

// Personality preview: each slider independently controls a fragment.
// 5 bands × 3 sliders = 15 fragments. Small slider movements toggle visible changes.
const FRAGMENTS = {
  // Warm slider — opening / greeting tone
  warm: [
    "",                                           // 0-20: cold cold
    "Q3 results attached.",                        // 21-40: brief acknowledgment
    "Quick note on Q3.",                           // 41-60: balanced
    "Hey, Q3 numbers are in.",                     // 61-80: warm
    "Hey! Q3 numbers came in and they look good.", // 81-100: very warm
  ],
  // Concise slider — body length
  concise: [
    "Rev +18%, churn -2pts.",
    "Revenue +18% YoY. Churn down 2 points.",
    "Revenue grew 18% year over year, and churn dropped 2 points, mostly from mid-market.",
    "Revenue grew 18% year over year, with mid-market driving most of it. Churn dropped 2 points across the same segment.",
    "Revenue grew 18% year over year. The strongest growth came from mid-market accounts. Churn decreased 2 percentage points, with the biggest improvement among accounts that engaged with our new support program. Three drivers stood out: onboarding work, the renewals process, and feature adoption.",
  ],
  // Formal slider — sign-off tone (higher = more casual)
  formal: [
    "Full breakdown in the attached report.",
    "Deck attached for Monday.",
    "Deck attached for Monday's review.",
    "Threw together a deck for Monday. Slide 4 has the punchline.",
    "Quick deck attached, slide 4 has the punchline. 🎯",
  ],
};

function band(value) {
  if (value < 20) return 0;
  if (value < 40) return 1;
  if (value < 60) return 2;
  if (value < 80) return 3;
  return 4;
}

function getPersonalityPreview(formal, concise, warm) {
  const greeting = FRAGMENTS.warm[band(warm)];
  const body = FRAGMENTS.concise[band(concise)];
  const closing = FRAGMENTS.formal[band(formal)];
  return [greeting, body, closing].filter(Boolean).join(" ");
}

function Step4Domains({ data, update }) {
  const toggle = (id) => {
    const selected = data.workDomains.includes(id);
    const nextDomains = selected
      ? data.workDomains.filter(x => x !== id)
      : [...data.workDomains, id];
    const nextPriority = data.priorityDomains.filter(x => nextDomains.includes(x));
    update({ workDomains: nextDomains, priorityDomains: nextPriority });
  };

  const togglePriority = (id) => {
    if (!data.workDomains.includes(id)) return;
    const inPriority = data.priorityDomains.includes(id);
    if (inPriority) {
      update({ priorityDomains: data.priorityDomains.filter(x => x !== id) });
    } else {
      if (data.priorityDomains.length >= 3) return;
      update({ priorityDomains: [...data.priorityDomains, id] });
    }
  };

  const maxPriority = Math.min(3, data.workDomains.length);

  return (
    <StepShell
      eyebrow="Work domains"
      title="What's your agent for?"
      subtitle="Pick everything that applies. Then rank your top 3."
    >
      <div className="grid grid-cols-2 gap-2">
        {DOMAINS.map(d => {
          const on = data.workDomains.includes(d.id);
          return (
            <button
              key={d.id}
              onClick={() => toggle(d.id)}
              className={`flex items-center gap-3 p-3 rounded-md border text-left transition-all ${
                on ? "bg-accentSoft border-ink" : "bg-card border-2 border-ink/25 hover:border-ink hover:bg-accentSoft"
              }`}
            >
              <div className={`w-8 h-8 rounded flex items-center justify-center mono text-sm ${
                on ? "bg-ink text-paper" : "bg-ink/5"
              }`}>
                {d.icon}
              </div>
              <span className="text-sm font-medium">{d.label}</span>
            </button>
          );
        })}
      </div>
      {data.workDomains.length > 0 && (
        <div className="pt-6 border-t border-ink/15">
          <div className="mono text-xs text-ink/60 uppercase tracking-widest mb-1">Priority ranking</div>
          <p className="text-sm text-ink/70 mb-4">
            {data.workDomains.length === 1 && "Your #1 priority."}
            {data.workDomains.length === 2 && "Rank both in order — tap #1 first, then #2."}
            {data.workDomains.length >= 3 && `Pick your top ${maxPriority} in order — tap #1 first. Tap again to remove.`}
            {" "}
            <span className="mono text-xs text-ink/40">
              ({data.priorityDomains.length} of {maxPriority} selected)
            </span>
          </p>
          <div className="space-y-2">
            {data.workDomains.map(id => {
              const domain = DOMAINS.find(d => d.id === id);
              const rank = data.priorityDomains.indexOf(id);
              return (
                <button
                  key={id}
                  onClick={() => togglePriority(id)}
                  className={`w-full flex items-center gap-3 p-3 rounded-md border text-left transition-all ${
                    rank >= 0 ? "bg-card border-ink" : "bg-paper border-ink/15 hover:border-ink/40"
                  }`}
                >
                  <div className={`w-8 h-8 rounded flex items-center justify-center mono text-sm font-semibold ${
                    rank >= 0 ? "bg-ink text-paper" : "bg-card border border-ink/25 text-ink/40"
                  }`}>
                    {rank >= 0 ? rank + 1 : "—"}
                  </div>
                  <span className="text-sm">{domain.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      )}
      <Field label="Anything else?" hint="Free-text. Capture domains we didn't list above.">
        <input
          type="text"
          value={data.workDomainsOther}
          onChange={e => update({ workDomainsOther: e.target.value })}
          placeholder="e.g. inventory tracking, podcast prep, fundraising outreach..."
          className={inputClass}
        />
      </Field>
    </StepShell>
  );
}

function Step5Tools({ data, update }) {
  const requiredIds = new Set(
    data.workDomains.flatMap(id => DOMAINS.find(d => d.id === id)?.requires || [])
  );

  const toggle = (id) => {
    const next = { ...data.integrations };
    if (next[id]) {
      delete next[id];
    } else {
      next[id] = { planned: true };
    }
    // Drop priority entries that are no longer selected
    const nextPriority = data.priorityIntegrations.filter(x => next[x]);
    update({ integrations: next, priorityIntegrations: nextPriority });
  };

  const togglePriority = (id) => {
    if (!data.integrations[id]) return;
    const inPriority = data.priorityIntegrations.includes(id);
    if (inPriority) {
      update({ priorityIntegrations: data.priorityIntegrations.filter(x => x !== id) });
    } else {
      if (data.priorityIntegrations.length >= 3) return;
      update({ priorityIntegrations: [...data.priorityIntegrations, id] });
    }
  };

  // Split integrations: standard (non-CRM, included in build) and CRM (add-on, separately quoted)
  const isCRM = (i) => i.category === "crm";
  const coreIntegrations = INTEGRATIONS.filter(i => !isCRM(i));
  const crmIntegrations = INTEGRATIONS.filter(i => isCRM(i));

  const planned = Object.keys(data.integrations).length;
  // Priority ranking only applies to CORE tools — CRMs are add-ons, not part of the launch priority list
  const corePlanned = Object.keys(data.integrations).filter(id => {
    const i = INTEGRATIONS.find(x => x.id === id);
    return i && !isCRM(i);
  });
  const corePrioritySelected = data.priorityIntegrations.filter(id => corePlanned.includes(id)).length;
  const maxPriority = Math.min(3, corePlanned.length);
  const allLabel = (id) => INTEGRATIONS.find(i => i.id === id)?.label;

  const renderToolButton = (i) => {
    const isPlanned = data.integrations[i.id]?.planned;
    const required = requiredIds.has(i.id);
    return (
      <button
        key={i.id}
        onClick={() => toggle(i.id)}
        className={`flex items-center gap-3 p-3 border-2 text-left transition-all ${
          isPlanned ? "bg-accentSoft border-ink" : "bg-card border-ink/25 hover:border-ink hover:bg-accentSoft"
        }`}
      >
        <div className={`w-5 h-5 flex items-center justify-center flex-shrink-0 ${
          isPlanned ? "bg-ink" : "border-2 border-ink/25"
        }`}>
          {isPlanned && (
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#3EB8C8" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="5 12 10 17 19 8" />
            </svg>
          )}
        </div>
        <span className="text-sm font-medium flex-1">{i.label}</span>
        {required && (
          <span className="mono text-[10px] text-accent">SUGGESTED</span>
        )}
      </button>
    );
  };

  return (
    <StepShell
      eyebrow="Tools"
      title="Which tools should your agent connect to?"
      subtitle="Pick everything your team uses. Then rank your top 3 standard tools — those are the ones we'll wire up at launch."

function PersonalityStat({ label, inverse, value }) {
  const leaning = value < 40 ? label : value > 60 ? inverse : "Balanced";
  return (
    <div className="min-w-0">
      <div className="text-ink/40 uppercase tracking-widest text-[10px] truncate">{label} / {inverse}</div>
      <div className="font-semibold text-ink mt-0.5 text-sm">{leaning}</div>
    </div>
  );
}

function bandLabel(value, low, mid, high) {
  if (value < 33) return low;
  if (value > 66) return high;
  return mid;
}

function buildIntakeText(data) {
  // Plain text — designed to read naturally in an email attachment, terminal, or text editor.
  // No markdown markup. Uses ASCII separators and indentation for visual structure.

  const industries = data.industries
    .map(v => INDUSTRIES.find(i => i.value === v)?.label)
    .filter(Boolean);
  if (data.industryOther) industries.push(data.industryOther);

  const priorityDomainLabels = data.priorityDomains
    .map(id => DOMAINS.find(d => d.id === id)?.label)
    .filter(Boolean);
  const nonPriorityDomains = data.workDomains
    .filter(id => !data.priorityDomains.includes(id))
    .map(id => DOMAINS.find(d => d.id === id)?.label)
    .filter(Boolean);

  // Split integrations into core (non-CRM) and CRM add-ons
  const isCRM = (id) => INTEGRATIONS.find(i => i.id === id)?.category === "crm";
  const teamSizeLabel = TEAM_SIZES.find(t => t.value === data.teamSize)?.label;
  const agentScopeObj = AGENT_SCOPES.find(s => s.value === data.agentScope);

  const now = new Date();
  const dateStr = now.toLocaleString("en-US", { dateStyle: "long", timeStyle: "short" });

  const HEAVY = "=".repeat(72);
  const LIGHT = "-".repeat(72);
  const center = (txt, w = 72) => {
    const pad = Math.max(0, Math.floor((w - txt.length) / 2));
    return " ".repeat(pad) + txt;
  };
  const section = (title) => [LIGHT, "  " + title.toUpperCase(), LIGHT];
  const kv = (key, val, width = 14) => `  ${(key + ":").padEnd(width)} ${val ?? ""}`;
  const bullet = (txt) => `  • ${txt}`;

  const lines = [];

  // Header
  lines.push(HEAVY);
  lines.push(center("CLIENT AGENT INTAKE"));
  lines.push(HEAVY);
  lines.push("");
  lines.push(kv("Captured", dateStr));
  lines.push(kv("Source", "Discovery call"));
  lines.push("");

  // Client
  lines.push(...section("Client"));
  lines.push("");
  lines.push(kv("Name", data.name));
  lines.push(kv("Email", data.email));
  lines.push("");

  // Business
  lines.push(...section("Business"));
  lines.push("");
  lines.push(`  ${data.businessName}` + (data.businessWebsite ? `   (${data.businessWebsite})` : ""));
  if (industries.length > 0) {
    lines.push(kv("Industries", industries.join(", ")));
  }
  if (teamSizeLabel) {
    lines.push(kv("Team size", teamSizeLabel));
  }
  if (agentScopeObj) {
    lines.push(kv("Agent scope", `${agentScopeObj.label} (${agentScopeObj.desc})`));
  }
  lines.push("");
  // Wrap description to ~66 cols, indented 2 spaces
  const wrapped = wrapText(data.businessDescription, 66).map(l => "  " + l);
  lines.push(...wrapped);
  lines.push("");
  if (data.targetAudience) {
    lines.push(kv("Serves", data.targetAudience));
    lines.push("");
  }

  // Agent
  lines.push(...section("Agent"));
  lines.push("");
  lines.push(kv("Name", data.agentName));
  lines.push(kv("Emoji", data.agentChoosesEmoji ? "(agent chooses on launch)" : data.agentEmoji));
  lines.push(kv("One-liner", `"${data.agentDescription}"`));
  lines.push("");
  lines.push(`  --- Personality ---`);
  lines.push("");
  lines.push(`    Formal  <-->  Casual       ${String(data.formal).padStart(3)}    (${bandLabel(data.formal, "Formal", "Balanced", "Casual")})`);
  lines.push(`    Concise <-->  Thorough     ${String(data.concise).padStart(3)}    (${bandLabel(data.concise, "Concise", "Balanced", "Thorough")})`);
  lines.push(`    Reserved <-->  Warm        ${String(data.warm).padStart(3)}    (${bandLabel(data.warm, "Reserved", "Balanced", "Warm")})`);
  lines.push("");
  lines.push(kv("Style", (data.communicationStyle || "").replace("_", " ")));
  lines.push("");
  if (data.neverDo.length > 0 || data.neverDoCustom) {
    lines.push(`  Never do:`);
    data.neverDo.forEach(rule => lines.push(`    • ${rule}`));
    if (data.neverDoCustom) {
      lines.push(`    • (Custom) ${data.neverDoCustom}`);
    }
    lines.push("");
  }

  // Work domains
  lines.push(...section("Work domains"));
  lines.push("");
  if (priorityDomainLabels.length > 0) {
    lines.push(`  Priority (top ${priorityDomainLabels.length}):`);
    priorityDomainLabels.forEach((label, i) => lines.push(`    ${i + 1}.  ${label}`));
    lines.push("");
  }
  if (nonPriorityDomains.length > 0) {
    lines.push(`  Also:  ${nonPriorityDomains.join(", ")}`);
    lines.push("");
  }
  if (data.workDomainsOther) {
    lines.push(kv("Other", data.workDomainsOther));
    lines.push("");
  }

  // Tools — split into core (non-CRM, in the standard build) and CRM add-ons (NOT in standard build)
  const allPicked = Object.keys(data.integrations);
  const coreToolIds = allPicked.filter(id => !isCRM(id));
  const crmToolIds = allPicked.filter(id => isCRM(id));

  const corePriorityIds = data.priorityIntegrations.filter(id => coreToolIds.includes(id));
  const coreSecondaryIds = coreToolIds.filter(id => !corePriorityIds.includes(id));
  const labelFor = (id) => INTEGRATIONS.find(i => i.id === id)?.label || id;

  lines.push(...section("Tools to connect at launch"));
  lines.push("");
  if (corePriorityIds.length > 0) {
    lines.push(`  Priority (top ${corePriorityIds.length}):`);
    corePriorityIds.forEach((id, i) => lines.push(`    ${i + 1}.  ${labelFor(id)}`));
    lines.push("");
  }
  if (coreSecondaryIds.length > 0) {
    lines.push(`  Also discussed: ${coreSecondaryIds.map(labelFor).join(", ")}`);
    lines.push("");
  }
  if (corePriorityIds.length === 0 && coreSecondaryIds.length === 0) {
    lines.push(`  (none selected)`);
    lines.push("");
  }
  if (data.integrationsOther) {
    lines.push(kv("Other", data.integrationsOther));
    lines.push("");
  }

  // CRM add-ons — flagged separately because they're NOT part of the standard build
  if (crmToolIds.length > 0) {
    lines.push(...section("CRM add-ons (not in standard build)"));
    lines.push("");
    lines.push(`  These integrations are noted but require a separate quote.`);
    lines.push(`  They are NOT included in the standard agent build.`);
    lines.push("");
    crmToolIds.forEach(id => lines.push(`    • ${labelFor(id)}`));
    lines.push("");
  }

  // Footer
  lines.push(HEAVY);
  lines.push("  Generated by SN Agent Discovery");
  lines.push(HEAVY);

  return lines.join("\n");
}

function wrapText(text, width) {
  if (!text) return [""];
  const words = text.split(/\s+/);
  const out = [];
  let line = "";
  for (const w of words) {
    if ((line + " " + w).trim().length > width) {
      if (line) out.push(line);
      line = w;
    } else {
      line = (line + " " + w).trim();
    }
  }
  if (line) out.push(line);
  return out;
}

// Filename: SNForge-{business-slug}_{agent-slug}_intake_{YYYYMMDD}.txt
// Example:  SNForge-acme-realty_sage_intake_20260512.txt
// The "SNForge-" prefix groups all Strategy Ninjas Agent Forge intakes together when
// sorted in any folder view. Underscores between segments + dashes inside slugs so the
// filename stays scannable when business or agent name has spaces.
const FILENAME_PREFIX = "SNForge-";

function slugify(s) {
  return (s || "").toString().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}

function getIntakeFilename(data) {
  const businessSlug = slugify(data.businessName) || "client";
  const agentSlug = slugify(data.agentName);
  const today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
  const parts = [businessSlug];
  if (agentSlug) parts.push(agentSlug);
  parts.push("intake", today);
  return FILENAME_PREFIX + parts.join("_") + ".txt";
}

// Downloads the .txt intake file locally. Called from Step 6 "Confirm details" handler.
function downloadIntakeFile(data) {
  const content = buildIntakeText(data);
  const blob = new Blob([content], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = getIntakeFilename(data);
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 500);
}

// Posts the intake .txt to the team Drive folder via a Google Apps Script web app.
// Fire-and-forget — wizard doesn't block on the response. If the backend URL isn't
// configured (DRIVE_BACKEND_URL empty), this is a no-op. The local download still fires
// either way, so the intake never gets lost.
function postToDrive(data) {
  if (!DRIVE_BACKEND_URL) return;
  const payload = {
    txtFilename: getIntakeFilename(data),
    txtContent: buildIntakeText(data),
  };
  // text/plain content-type avoids a CORS preflight (Apps Script can't handle OPTIONS).
  // The Apps Script parses the body as JSON server-side.
  fetch(DRIVE_BACKEND_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  }).catch(err => console.warn("Drive backend POST failed (silent fallback):", err));
}

function fireConfetti() {
  if (typeof confetti !== "function") return;
  const burst = (opts) => confetti({
    particleCount: 60,
    spread: 70,
    startVelocity: 45,
    gravity: 0.9,
    ticks: 200,
    colors: ["#0a0a0a", "#4338ca", "#eef2ff", "#f59e0b", "#fafaf9"],
    ...opts,
  });
  burst({ origin: { x: 0.5, y: 0.55 } });
  setTimeout(() => burst({ particleCount: 40, angle: 60, spread: 55, origin: { x: 0, y: 0.7 } }), 180);
  setTimeout(() => burst({ particleCount: 40, angle: 120, spread: 55, origin: { x: 1, y: 0.7 } }), 320);
}

function Step6Review({ data, editFromReview, onSubmit, onBack }) {
  // Phases: 'review' → 'sending' (build animation + silent backend) → onSubmit() advances to Step 7 (Pricing)
  const [phase, setPhase] = useState("review");
  const [stageIdx, setStageIdx] = useState(0);
  const [completedStages, setCompletedStages] = useState([]);
  const stages = BUILD_STAGES;
  const stageDuration = 500;

  // Drive build animation + silent send during 'sending' phase
  useEffect(() => {
    if (phase !== "sending") return;

    // === DELIVERY ===
    // 1. Local download to consultant's Downloads folder (always)
    // 2. POST to Google Apps Script → drops .txt into the team Drive folder
    //    (only if DRIVE_BACKEND_URL is configured; otherwise silently no-ops)
    downloadIntakeFile(data);
    postToDrive(data);

    const timers = stages.map((_, i) =>
      setTimeout(() => {
        setStageIdx(i);
        setCompletedStages(c => i > 0 ? [...c, i - 1] : c);
      }, i * stageDuration)
    );
    const done = setTimeout(() => {
      setCompletedStages(stages.map((_, i) => i));
      fireConfetti();
      // Brief beat after the recap finishes before advancing
      setTimeout(() => onSubmit(), 1100);
    }, stages.length * stageDuration + 300);
    return () => { timers.forEach(clearTimeout); clearTimeout(done); };
  }, [phase]);

  // ---------- review ----------
  if (phase === "review") {
    return (
      <StepShell
        eyebrow="Review"
        title={`Meet ${data.agentName} ${data.agentChoosesEmoji ? "✨" : data.agentEmoji}`}
        subtitle="Take one last look together. Click Edit on any card to tweak something. When it's right, confirm — your intake files will download to my machine and we'll move on to pricing."
      >
        <AgentSpecCards data={data} editFromReview={editFromReview} />
        <div className="pt-6 border-t-2 border-ink/15 flex items-center justify-between flex-wrap gap-3">
          <button
            onClick={onBack}
            className="mono text-xs uppercase tracking-widest font-semibold text-ink/70 hover:text-ink transition-colors"
          >
            ← Back to tools
          </button>
          <button
            onClick={() => setPhase("sending")}
            className="display font-black text-xs uppercase tracking-widest bg-accent text-ink border-2 border-ink px-6 py-3 shadow-brut hover:shadow-brut-hover hover:-translate-x-0.5 hover:-translate-y-0.5 active:translate-x-0 active:translate-y-0 active:shadow-brut-sm transition-all"
          >
            Confirm details →
          </button>
        </div>
        <p className="text-xs text-ink/60 text-center pt-2">
          Confirming downloads the intake to my machine. Next we'll review pricing together.
        </p>
      </StepShell>
    );
  }

  // ---------- sending (journey-recap animation + silent backend fire) ----------
  const stage = stages[stageIdx];
  const title = typeof stage.title === "function" ? stage.title(data) : stage.title;
  return (
    <div className="text-center py-8">
      <div className="relative w-32 h-32 mx-auto mb-8">
        <div className="absolute inset-0 border-4 border-accent pulse-ring circle"></div>
        <div key={stageIdx} className="absolute inset-0 flex items-center justify-center text-5xl scale-in">
          {stage.emoji}
        </div>
      </div>
      <div className="mono text-xs text-ink/60 uppercase tracking-widest font-semibold mb-2">Saving your spec</div>
      <h1 className="font-black text-2xl md:text-3xl mb-2">{title}</h1>
      <p className="text-ink/70 text-sm mb-8">{stage.sub}</p>
      <div className="flex items-center justify-center gap-2 flex-wrap max-w-md mx-auto">
        {stages.map((s, i) => {
          const done = completedStages.includes(i);
          const active = i === stageIdx;
          return (
            <div
              key={i}
              className={`w-10 h-10 flex items-center justify-center text-lg transition-all border-2 circle ${
                active ? "bg-accent border-ink scale-110 shadow-brut-sm" :
                done ? "bg-ink border-ink text-accent" :
                "bg-card border-ink/20 opacity-50"
              }`}
            >
              {done && !active ? (
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3EB8C8" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
                  <polyline points="5 12 10 17 19 8" />
                </svg>
              ) : s.emoji}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================================
// STEP 7 — WELCOME / CONGRATS (final page)
// AI Operator framing — "first step on the path to becoming an AI Operator"
// Generic timeline that doesn't depend on a pricing tier
// ============================================================================

function Step7Welcome({ data }) {
  const firstName = data.name?.split(" ")[0] || "there";

  const timeline = [
    { tag: "Step 1", title: "Discovery captured", body: "You just finished it. Your spec is on its way to our team." },

    { tag: "Step 4", title: "Handoff + training", body: "When the agent is ready, we run a live handoff call. You walk away with a working agent and the skills to operate it." },
  ];

  return (
    <div className="py-4 fade-in">
      <div className="text-center mb-10">
        <div className="w-20 h-20 bg-ink text-accent border-2 border-ink shadow-brut mx-auto mb-6 flex items-center justify-center circle font-black text-4xl">
          ✓
        </div>
        <div className="mono text-xs text-accent uppercase tracking-widest font-semibold mb-2">Welcome, AI Operator</div>
        <h1 className="text-3xl md:text-5xl font-bold mb-4">
          You just took your first step.
        </h1>
        <p className="text-ink/75 text-base md:text-lg max-w-xl mx-auto leading-relaxed">
          Building your AI agent is the first step on the path to becoming an{" "}
          <span className="serif italic font-semibold">AI Operator</span> —
          the person on your team who knows how to design, deploy, and run intelligent systems.
          You're not just getting an agent, {firstName}. You're learning how to build one.
        </p>
      </div>

      <div className="max-w-2xl mx-auto">
        <div className="mono text-xs text-ink/60 uppercase tracking-widest font-semibold mb-3 px-1">What happens next</div>
        {timeline.map((stage, i) => (
          <div key={i} className={`flex gap-4 items-start p-5 bg-card border-2 border-ink ${i > 0 ? "border-t-0" : ""}`}>
            <div className="w-10 h-10 bg-ink text-accent display font-black flex items-center justify-center flex-shrink-0 text-lg circle">
              {i + 1}
            </div>
            <div className="flex-1">
              <div className="mono text-xs text-ink/60 uppercase tracking-widest font-semibold mb-1">{stage.tag}</div>
              <div className="display font-black uppercase text-base text-ink mb-1">{stage.title}</div>
              <p className="text-sm text-ink/70 leading-relaxed">{stage.body}</p>
            </div>
          </div>
        ))}
      </div>

      <p className="text-xs text-ink/60 text-center mt-10 max-w-md mx-auto">
        Questions before we get back to you? Reach out anytime at john@thestrategyninjas.com.
      </p>

      <IntakePreview data={data} />
    </div>
  );
}

function IntakePreview({ data }) {
  const [open, setOpen] = useState(false);
  const txt = useMemo(() => buildIntakeText(data), [data]);

  if (!open) {
    return (
      <div className="text-center mt-12 pt-6 border-t border-ink/10">
        <button
          onClick={() => setOpen(true)}
          className="mono text-xs text-ink/40 hover:text-ink transition-colors"
        >
          ◧ Preview intake (internal use)
        </button>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4 py-6 overlay-in" style={{ background: "rgba(24, 24, 24, 0.5)" }}>
      <div className="bg-card border-2 border-ink shadow-brut-lg max-w-3xl w-full max-h-full flex flex-col">
        <div className="flex items-center justify-between p-5 border-b-2 border-ink">
          <div>
            <div className="mono text-xs text-ink/60 uppercase tracking-widest font-semibold">Intake preview</div>
            <div className="display font-black text-sm uppercase tracking-tight">Internal use — shows what gets saved to Drive</div>
          </div>
          <button
            onClick={() => setOpen(false)}
            className="w-8 h-8 hover:bg-ink/5 flex items-center justify-center text-ink/60 font-black"
            aria-label="Close"
          >
            ✕
          </button>
        </div>
        <div className="overflow-y-auto p-6 flex-1 bg-paper">
          <pre className="mono text-xs text-ink/90 whitespace-pre leading-relaxed">{txt}</pre>
        </div>
        <div className="border-t-2 border-ink p-4 flex items-center justify-between gap-3 flex-wrap bg-card">
          <div className="text-xs text-ink/60">
            On Confirm details, this file downloads locally and posts to the team Drive folder.
          </div>
          <div className="flex gap-2">
            <button
              onClick={() => {
                navigator.clipboard?.writeText(txt);
              }}
              className="mono text-xs uppercase tracking-widest font-semibold px-3 py-1.5 border-2 border-ink hover:bg-paper"
            >
              Copy
            </button>
            <button
              onClick={() => {
                const blob = new Blob([txt], { type: "text/plain" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = getIntakeFilename(data);
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 100);
              }}
              className="mono text-xs uppercase tracking-widest font-semibold px-3 py-1.5 bg-ink text-accent border-2 border-ink hover:bg-ink/90"
            >
              Download
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
