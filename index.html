// ============================================================================
// ENCRYPTION (Web Crypto, RSA-OAEP SHA-256)
// ============================================================================

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bytesToB64(bytes) {
  let bin = "";
  const arr = new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin);
}

let _pubKeyPromise = null;
function getPublicKey() {
  if (!_pubKeyPromise) {
    _pubKeyPromise = crypto.subtle.importKey(
      "spki",
      b64ToBytes(PUBLIC_KEY_SPKI_B64),
      { name: "RSA-OAEP", hash: "SHA-256" },
      false,
      ["encrypt"]
    );
  }
  return _pubKeyPromise;
}

// Encrypts a string with the SN public key. Returns base64 ciphertext, or "" for empty input.
async function encryptField(plaintext) {
  if (!plaintext) return "";
  const key = await getPublicKey();
  const data = new TextEncoder().encode(plaintext);
  const ct = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, key, data);
  return bytesToB64(ct);
}

// ?preview=faces jumps straight to the thank-you page with the gallery open —
// a shareable way for the team to see it without filling out the whole form.
const PREVIEW = new URLSearchParams(window.location.search).get("preview") === "faces";

function App() {
  const [data, setData] = useState(initialData);
  const [modal, setModal] = useState(null);
  const [phase, setPhase] = useState(PREVIEW ? "done" : "form"); // form | submitting | done | error
  const [errorMsg, setErrorMsg] = useState("");
  const [showBot, setShowBot] = useState(false);
  const [showKey, setShowKey] = useState(false);

  const update = (patch) => setData(d => ({ ...d, ...patch }));

  // Telegram ID list helpers
  const setTgId = (i, val) => setData(d => {
    const next = [...d.telegramUserIds]; next[i] = val; return { ...d, telegramUserIds: next };
  });
  const addTgId = () => setData(d => ({ ...d, telegramUserIds: [...d.telegramUserIds, ""] }));
  const removeTgId = (i) => setData(d => ({ ...d, telegramUserIds: d.telegramUserIds.filter((_, x) => x !== i) }));

  const valid = useMemo(() => {
    const typeOk = data.agentType && (data.agentType !== "Other" || data.agentTypeOther.trim().length > 1);
    const tzOk = data.timezone && (data.timezone !== "Other" || data.timezoneOther.trim().length > 1);
    const tgOk = data.telegramUserIds.some(id => id.trim().length >= 3);
    return (
      typeOk &&
      data.clientName.trim().length >= 2 &&
      data.companyName.trim().length >= 2 &&
      data.websites.trim().length >= 3 &&
      tzOk &&
      tgOk &&
      data.agentName.trim().length >= 2 &&
      data.botToken.trim().length >= 10 &&
      data.apiKey.trim().length >= 10 &&
      data.consent === true
    );
  }, [data]);

  const slug = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

  const submit = async () => {
    if (!valid || phase === "submitting") return;
    setPhase("submitting");
    setErrorMsg("");
    try {
      // Collect the Telegram IDs (drop blanks) into one comma-joined string, then encrypt.
      const tgList = data.telegramUserIds.map(s => s.trim()).filter(Boolean).join(", ");

      // Encrypt the sensitive fields in the browser before anything leaves the page.
      const [encTgIds, encBot, encKey] = await Promise.all([
        encryptField(tgList),
        encryptField(data.botToken.trim()),
        encryptField(data.apiKey.trim()),
      ]);

      const timezone = data.timezone === "Other" ? data.timezoneOther.trim() : data.timezone;

      const today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      const filename = `SNForge-${slug(data.companyName) || "client"}_${slug(data.agentName) || "agent"}_setup_${today}.txt`;

      const payload = {
        kind: "agent_setup_v2",
        schema_version: SCHEMA_VERSION,
        encryption_key_id: KEY_ID,
        filename,
        agentType: data.agentType === "Other" ? data.agentTypeOther.trim() : data.agentType,
        clientName: data.clientName.trim(),
        companyName: data.companyName.trim(),
        websites: data.websites.trim(),
        timezone,
        agentName: data.agentName.trim(),
        commStyle: data.commStyle.trim(),
        businessContext: data.businessContext.trim(),
        consent: data.consent === true,
        // encrypted (base64 RSA-OAEP ciphertext)
        enc_telegramUserIds: encTgIds,
        enc_botToken: encBot,
        enc_apiKey: encKey,
        capturedAt: new Date().toString(),
      };

      // text/plain avoids a CORS preflight; Apps Script parses the body as JSON.
      await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });

      if (typeof confetti === "function") {
        confetti({ particleCount: 70, spread: 75, startVelocity: 45, gravity: 0.9, ticks: 200, origin: { x: 0.5, y: 0.5 }, colors: ["#3EB8C8", "#181818", "#BBB469", "#F7F3EA"] });
      }
      setPhase("done");
    } catch (e) {
      setErrorMsg(String(e));
      setPhase("error");
    }
  };

  if (phase === "done") {
    return <ThankYou data={data} />;
  }

          </div>

        </div>

            ))}
          </div>
          {data.agentType === "Other" && (

              placeholder="Describe the agent type you need..."
              className={inputClass + " mt-2"}
              autoFocus
            />
          )}
        </Field>

        {/* Client name */}
        <Field label="Your name" required>
          <input type="text" value={data.clientName} onChange={e => update({ clientName: e.target.value })} placeholder="Jane Smith" className={inputClass} />
        </Field>

        {/* Company */}
        <Field label="Company name" required>
          <input type="text" value={data.companyName} onChange={e => update({ companyName: e.target.value })} placeholder="Acme Realty" className={inputClass} />
        </Field>

        {/* Websites */}
        <Field label="Company website" required hint="If you have more than one, separate them with commas.">
          <input type="text" value={data.websites} onChange={e => update({ websites: e.target.value })} placeholder="acme.com, acme-listings.com" className={inputClass} />
        </Field>

        {/* Timezone */}
        <Field label="Your timezone" required hint="So your agent handles scheduling, reminders, and daily briefs at the right times.">
          <select value={data.timezone} onChange={e => update({ timezone: e.target.value })} className={inputClass}>
            <option value="" disabled>Select your timezone…</option>
            {TIMEZONES.map(tz => <option key={tz} value={tz}>{tz}</option>)}
          </select>
          {data.timezone === "Other" && (
            <input type="text" value={data.timezoneOther} onChange={e => update({ timezoneOther: e.target.value })} placeholder="Which timezone are you in?" className={inputClass + " mt-2"} autoFocus />
          )}

        {/* Telegram User ID(s) */}
        <Field label="Your Telegram User ID" required howto="How to find this" onHowto={() => setModal("tgUserId")} hint="A ~10-digit number that tells your agent who you are. Add more than one if a few people will share this agent.">
          <div className="space-y-2">

        <div className="my-8 border-t-2 border-ink/10"></div>

        {/* Agent name */}
        <Field label="Your agent's name" required hint="What you'll call your agent. Anything you like.">
          <input type="text" value={data.agentName} onChange={e => update({ agentName: e.target.value })} placeholder="Atlas" className={inputClass} />
        </Field>

        {/* Bot token */}
        <Field label="Telegram Bot Token" required howto="How to create your bot" onHowto={() => setModal("botToken")} hint="🔒 Encrypted before it leaves this page.">
          <div className="relative">
            <input
              type={showBot ? "text" : "password"}
              value={data.botToken}
              onChange={e => update({ botToken: e.target.value })}
              placeholder="123456789:AAExampleTokenFromBotFather"
              className={inputClass + " pr-16"}
            />
            <button type="button" onClick={() => setShowBot(s => !s)} className="absolute right-3 top-1/2 -translate-y-1/2 mono text-[11px] uppercase tracking-widest text-ink/50 hover:text-ink">
              {showBot ? "Hide" : "Show"}
            </button>
          </div>
        </Field>

        {/* API key */}
        <Field label="Anthropic API Key" required howto="How to get your key" onHowto={() => setModal("apiKey")} hint="🔒 Encrypted before it leaves this page.">
          <div className="relative">
            <input
              type={showKey ? "text" : "password"}
              value={data.apiKey}
              onChange={e => update({ apiKey: e.target.value })}
              placeholder="sk-ant-api03-..."
              className={inputClass + " pr-16"}
            />
            <button type="button" onClick={() => setShowKey(s => !s)} className="absolute right-3 top-1/2 -translate-y-1/2 mono text-[11px] uppercase tracking-widest text-ink/50 hover:text-ink">
              {showKey ? "Hide" : "Show"}
            </button>
          </div>
        </Field>

        <div className="my-8 border-t-2 border-ink/10"></div>

        {/* Comm style */}
        <Field label="Preferred communication style" hint="How should your agent talk to you? Formal or casual, short or detailed, any quirks — describe it in your words.">
          <textarea value={data.commStyle} onChange={e => update({ commStyle: e.target.value })} rows={3} placeholder="Friendly and to the point. Skip the fluff. Use bullet points for anything with more than two items..." className={inputClass + " resize-none"} />
        </Field>

        {/* Business context */}
        <Field label="Anything else we should know" hint="Business details, use cases, ideas, daily tasks, current projects — anything that gives your agent useful context.">
          <textarea value={data.businessContext} onChange={e => update({ businessContext: e.target.value })} rows={5} placeholder="We're a boutique real estate team. Day to day we juggle showings, follow-ups, and paperwork. I'd love the agent to draft my follow-up emails and keep my calendar sane..." className={inputClass + " resize-none"} />
        </Field>

        {/* Submit */}
        <div className="mt-10 pt-6 border-t-2 border-ink">
          {/* Consent */}
          <label className="flex items-start gap-3 mb-6 cursor-pointer">
            <input
              type="checkbox"
              checked={data.consent}
              onChange={e => update({ consent: e.target.checked })}
              className="mt-0.5 w-5 h-5 flex-shrink-0"
            />
            <span className="text-sm text-ink/75 leading-relaxed">
              I authorize Strategy Ninjas to configure and deploy an AI agent using the information and credentials I've provided.
            </span>
          </label>

          {phase === "error" && (
            <div className="mb-4 p-4 border-2 border-ink bg-accentSoft text-sm">
              <div className="font-semibold mb-1">Something went wrong submitting.</div>
              <div className="text-ink/70">Please try again in a moment. If it keeps happening, email info@thestrategyninjas.com.</div>
            </div>
          )}
          <button
            onClick={submit}
            disabled={!valid || phase === "submitting"}
            className="w-full display font-black text-sm uppercase tracking-widest bg-accent text-ink border-2 border-ink px-6 py-4 shadow-brut hover:shadow-brut-hover hover:-translate-x-0.5 hover:-translate-y-0.5 active:translate-x-0 active:translate-y-0 active:shadow-brut-sm disabled:bg-ink/10 disabled:text-ink/30 disabled:shadow-none disabled:cursor-not-allowed disabled:hover:translate-x-0 disabled:hover:translate-y-0 transition-all flex items-center justify-center gap-3"
          >
            {phase === "submitting" ? (
              <>
                <svg className="spin-slow circle" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#181818" strokeWidth="3" strokeLinecap="round"><circle cx="12" cy="12" r="9" strokeDasharray="40 60" /></svg>
                Submitting...
              </>
            ) : "Submit my setup →"}
          </button>
          <p className="text-xs text-ink/50 text-center mt-3">
            🔒 Your Telegram ID(s), bot token, and API key are encrypted in your browser before they're sent. Only the Strategy Ninjas team can read them.
          </p>
        </div>
      </main>

      {modal && <HowToModal content={HOWTO[modal]} onClose={() => setModal(null)} />}
    </div>
  );
}

function Header() {
  return (
    <header className="border-b-2 border-ink bg-paper sticky top-0 z-40">
      <div className="max-w-2xl mx-auto px-6 py-4 flex items-center gap-3">
        <img src="sn-logo.png" alt="Strategy Ninjas" className="h-9 w-auto block flex-shrink-0" />
        <div className="mono text-[10px] text-ink/60 uppercase tracking-widest font-semibold hidden sm:block">Agent Setup</div>
      </div>
    </header>
  );
}

function ThankYou({ data }) {
  const [showGallery, setShowGallery] = useState(PREVIEW); // preview link opens the gallery immediately
  const [selected, setSelected] = useState(null);

  const agent = data.agentName || "your agent";
  const first = data.clientName ? `, ${data.clientName.split(" ")[0]}` : "";

  const burst = (opts) => {
    if (typeof confetti === "function") {
      confetti(Object.assign({ ticks: 200, colors: ["#3EB8C8", "#181818", "#BBB469", "#F7F3EA"] }, opts));
    }
  };

  const reveal = () => {
    setShowGallery(true);
    burst({ particleCount: 70, spread: 85, startVelocity: 42, gravity: 0.9, origin: { x: 0.5, y: 0.4 } });
    setTimeout(() => {
      const el = document.getElementById("pfp-gallery");
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 80);
  };

  const pick = (n) => {
    setSelected(n);
    burst({ particleCount: 26, spread: 55, startVelocity: 28, gravity: 1, scalar: 0.8, origin: { x: 0.5, y: 0.55 }, colors: ["#3EB8C8", "#BBB469"] });
  };

  const download = (pfp) => {
    const a = document.createElement("a");
    a.href = pfpDownload(pfp.id);
    a.download = "your-agent-face.png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  };

  return (
    <div className="min-h-screen flex flex-col">
      <Header />
      <main className="flex-1 flex flex-col items-center px-6 py-16">
        <div className="max-w-lg text-center fade-in">
          <div className="w-20 h-20 bg-ink text-accent border-2 border-ink shadow-brut mx-auto mb-8 flex items-center justify-center display font-black text-4xl scale-in circle">✓</div>
          <div className="mono text-xs text-accent uppercase tracking-widest font-semibold mb-3">Setup received</div>
          <h1 className="text-3xl md:text-4xl mb-4">You're all set{first}.</h1>
          <p className="text-ink/75 text-base md:text-lg leading-relaxed mb-8">
            We've got everything we need to build <span className="serif italic font-semibold">{agent}</span>. Our team will take it from here and reach out with next steps. Welcome aboard.
          </p>
          <div className="bg-card border-2 border-ink shadow-brut p-6 text-left">
            <div className="mono text-xs text-ink/60 uppercase tracking-widest font-semibold mb-3">What happens next</div>
            <ol className="text-sm text-ink/80 space-y-2 list-decimal list-inside">
              <li>We schedule your launch call.</li>
              <li>We build your agent.</li>
              <li>We launch it together on that call.</li>
            </ol>
          </div>

          {!showGallery && (
            <div className="mt-10">
              <div className="mono text-xs text-accent uppercase tracking-widest font-semibold mb-3">🎉 Now the fun part</div>
              <button
                onClick={reveal}
                className="display font-bold uppercase tracking-wide text-base px-8 py-4 bg-accent text-ink border-2 border-ink shadow-brut hover:shadow-brut-lg hover:-translate-x-1 hover:-translate-y-1 active:translate-x-0 active:translate-y-0 active:shadow-brut-sm transition-all"
              >
                🎨 Choose your agent's face →
              </button>
              <p className="text-xs text-ink/50 mt-3">Pick from 20 designs and download your favorite.</p>
            </div>
          )}

          <p className="text-xs text-ink/50 mt-10">Questions? Reach us anytime at info@thestrategyninjas.com.</p>
        </div>

        {showGallery && (
          <div id="pfp-gallery" className="w-full max-w-3xl mt-16 fade-in">
            <div className="text-center mb-8">
              <div className="mono text-xs text-accent uppercase tracking-widest font-semibold mb-2">Pick a face</div>
              <h2 className="text-2xl md:text-3xl mb-3">Give {agent} a face.</h2>
              <p className="text-sm text-ink/60 max-w-md mx-auto">Tap your favorite, then download it. Setting it on your bot takes one minute — we'll show you how.</p>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 md:gap-4">
              {AGENT_PFPS.map((pfp) => {
                const isSel = selected === pfp.n;
                return (
                  <button
                    key={pfp.n}
                    onClick={() => pick(pfp.n)}
                    className={`relative aspect-square bg-card overflow-hidden border-2 transition-all ${isSel ? "border-accent shadow-brut -translate-x-0.5 -translate-y-0.5" : "border-ink hover:shadow-brut-sm hover:-translate-x-0.5 hover:-translate-y-0.5"}`}
                  >
                    <img
                      src={pfpThumb(pfp.id)}
                      alt={`Agent face ${pfp.n}`}
                      loading={PREVIEW ? "eager" : "lazy"}
                      referrerPolicy="no-referrer"
                      onError={(e) => { if (!e.target.dataset.fb) { e.target.dataset.fb = "1"; e.target.src = pfpFull(pfp.id); } }}
                      className="w-full h-full object-cover"
                    />
                    {isSel && (
                      <div className="absolute inset-0 flex items-center justify-center bg-accent/25 overlay-in">
                        <div className="w-10 h-10 bg-accent text-ink border-2 border-ink flex items-center justify-center display font-black circle scale-in">✓</div>
                      </div>
                    )}
                    <div className="absolute top-1 left-1 mono text-[10px] font-semibold px-1.5 py-0.5 bg-ink/75 text-paper">{pfp.n}</div>
                  </button>
                );
              })}
            </div>

            {selected && (
              <div className="mt-8 text-center fade-in">
                <button
                  onClick={() => download(AGENT_PFPS[selected - 1])}
                  className="display font-bold uppercase tracking-wide text-sm px-8 py-4 bg-ink text-paper border-2 border-ink shadow-brut hover:bg-accent hover:text-ink transition-all"
                >
                  ⬇ Download face #{selected}
                </button>
                <div className="mt-6 max-w-md mx-auto bg-accentSoft border-2 border-ink p-4 text-left">
                  <div className="mono text-[11px] text-ink/70 uppercase tracking-widest font-semibold mb-2">Set it as your agent's photo</div>
                  <ol className="text-sm text-ink/80 space-y-1.5 list-decimal list-inside">
                    <li>In Telegram, open a chat with <span className="mono font-semibold">@BotFather</span>.</li>
                    <li>Send <span className="mono font-semibold">/setuserpic</span> and choose your bot.</li>
                    <li>Upload the image you just downloaded. That's your agent's face. ✨</li>
                  </ol>
                </div>
              </div>
            )}

            <p className="text-center text-xs text-ink/40 mt-10">
              Want to see them bigger? <a href={PFP_FOLDER_URL} target="_blank" rel="noopener noreferrer" className="underline hover:text-accent">Browse all designs in Drive →</a>
            </p>
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
