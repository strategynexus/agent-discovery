<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

// ============================================================================
// CONFIG
// ============================================================================

// Google Apps Script web-app endpoint that saves the intake to Drive + emails the team.
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwlDjUnvf-2SSI-vVdIUaWNDHyC3z4OLWmbzFPWwLQx9PXTp59s5q1pgFX4eaRt8aZY/exec";

// Artifact versioning. SCHEMA_VERSION tags the intake format; KEY_ID identifies which
// keypair encrypted the secrets (so a future key rotation stays traceable — bump KEY_ID
// whenever PUBLIC_KEY_SPKI_B64 below is replaced).
const SCHEMA_VERSION = "agent_setup_v2";
const KEY_ID = "sn-intake-2026-07";

// RSA-2048 public key (SPKI, base64). Encrypts the sensitive fields in the browser
// before anything is sent. Only SN3 holds the matching private key.
// Safe to be public — a public key can lock but never unlock.
const PUBLIC_KEY_SPKI_B64 = "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqdrQfCwJpaHbHe54lugac03rbMCT6Vtu+ZKWtyA9J9ynWxua5qPlv8uzVsmugnlgE+0Zt3NgqOELwUcfsxRoClnY6hvv11NubZrzdV94W6kpvJ9sp7jBF3YwFVOK29hbNZVZcgm3SuIS1Uhu85rnsbfXvGy+pMONCBlWVzo3xWidxTyeszDFxCnfhJ1e/Q+rE1Ti2xD8Oe5WtI/ruCAI03Bk8XBrlERtDN4e3UX1uzaQeMT5jo9y+l97zSOVIkVUuzi85qN6PGIBpAAyqjy+f4tfk6G8QgapuXyaJI+KE55KLu0RY3DZssx3hVQGTCZ1a7ewT6f90kGVi6WyT49+wQIDAQAB";


// RSA-2048 + OAEP(SHA-256) max plaintext = 256 - 2*32 - 2 = 190 bytes. Each extra
// secret is encrypted on its own, so the cap is per field.
const MAX_SECRET_BYTES = 190;         // plaintext that fits in ONE RSA-OAEP block (2048-bit key, SHA-256)
const RSA_BLOCK_BYTES = 256;          // size of each encrypted block
const MAX_LONG_SECRET_BYTES = 8000;   // extra credentials can be long (JSON keys, PEM files)
const byteLen = (s) => new TextEncoder().encode(s || "").length;

// ============================================================================
// ENCRYPTION (Web Crypto, RSA-OAEP SHA-256)
// ============================================================================

function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bytesToB64(bytes) {
  let bin = "";
  const arr = new Uint8Array(bytes);
  for (let i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
  return btoa(bin);
}

let _pubKeyPromise = null;
function getPublicKey() {
  if (!_pubKeyPromise) {
    _pubKeyPromise = crypto.subtle.importKey(
      "spki",
      b64ToBytes(PUBLIC_KEY_SPKI_B64),
      { name: "RSA-OAEP", hash: "SHA-256" },
      false,
      ["encrypt"]
    );
  }
  return _pubKeyPromise;
}

// Encrypts a string with the SN3 public key. Returns base64 ciphertext, or "" for empty input.
// A value longer than one block is split into 190-byte pieces; each piece becomes one
// 256-byte RSA block and the blocks are joined end to end. A short value is a single block,
// exactly as before. To decrypt: split into 256-byte blocks, decrypt each, join the bytes.
async function encryptField(plaintext) {
  if (!plaintext) return "";
  const key = await getPublicKey();
  const data = new TextEncoder().encode(plaintext);
  const count = Math.ceil(data.length / MAX_SECRET_BYTES);
  const out = new Uint8Array(count * RSA_BLOCK_BYTES);
  for (let i = 0; i < count; i++) {
    const piece = data.slice(i * MAX_SECRET_BYTES, (i + 1) * MAX_SECRET_BYTES);
    out.set(new Uint8Array(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, key, piece)), i * RSA_BLOCK_BYTES);
  }
  return bytesToB64(out);
}

// ============================================================================
// HOW-TO CONTENT (modal bodies)
// ============================================================================

// Each step is [title, detail, imagePath?]. If imagePath is set, it renders under the step.
const HOWTO = {
  tgUserId: {
    title: "Find your Telegram User ID",
    steps: [
      ["Download Telegram if you don't have it yet.", "iPhone/iPad: App Store → search \"Telegram Messenger\". Android: Google Play → search \"Telegram\"."],
      ["Create or log into your account.", "Use your mobile phone number."],
      ["Search for @userinfobot.", "Type it into Telegram's search bar. Tap the one with the blue check that looks like this:", "screenshots/userinfobot.png"],
      ["Open it and tap Start.", ""],
      ["The bot replies with your account details.", ""],
      ["Copy the number shown as \"Id\" or \"User ID\".", "It's about 10 digits. Paste it into the Telegram User ID field."],
    ],
  },
  botToken: {
    title: "Create your Telegram bot",
    steps: [
      ["In Telegram, search for @BotFather.", "Tap the verified account with the blue check that looks like this, then tap Start:", "screenshots/botfather.png"],
      ["Send this command: /newbot", ""],
      ["Enter a display name for the bot.", "This is the name people will see."],
      ["Enter a username for the bot.", "Must end in \"bot\", be unique across Telegram, and use only letters, numbers, and underscores."],
      ["BotFather creates the bot and shows an API token.", ""],
      ["Copy the full API token.", "Paste it into the Telegram Bot Token field."],
    ],
  },
  apiKey: {
    title: "Get your OpenRouter API key",
    steps: [
      ["Go to openrouter.ai and sign in.", "Create an account with Google, GitHub, or email if you don't have one yet."],
      ["Add credits to your account.", "Go to openrouter.ai/credits and add a balance ($50 recommended). Turn on auto top-up so your AI Employee never runs out."],
      ["Open the Keys page.", "Click your profile icon in the top right, choose \"Keys\" — or just go to openrouter.ai/keys."],
      ["Click \"Create Key\" and name it [your AI Employee name]-1.", "For example: Jane-1. You can leave the credit limit blank."],
      ["Copy the full key (it starts with sk-or-v1-).", "OpenRouter only shows it once. Paste it into the OpenRouter API Key field."],
    ],
  },
};

// ============================================================================
// SMALL UI PIECES
// ============================================================================

const inputClass = "w-full px-4 py-3 bg-card border-2 border-ink/25 focus:border-ink focus:outline-none focus:shadow-brut-sm transition-all text-sm placeholder:text-ink/30";

function Label({ children, required }) {
  return (
    <label className="block mono text-xs font-semibold uppercase tracking-widest text-ink/80 mb-2">
      {children} {required && <span className="text-accent">*</span>}
    </label>
  );
}

function Field({ label, required, hint, howto, onHowto, children }) {
  return (
    <div className="mb-6">
      <div className="flex items-baseline justify-between gap-3 mb-2">
        <label className="block mono text-xs font-semibold uppercase tracking-widest text-ink/80">
          {label} {required && <span className="text-accent">*</span>}
        </label>
        {howto && (
          <button
            type="button"
            onClick={onHowto}
            className="mono text-[11px] font-semibold uppercase tracking-widest text-accent hover:text-ink underline decoration-2 underline-offset-2 whitespace-nowrap"
          >
            ⓘ {howto}
          </button>
        )}
      </div>
      {children}
      {hint && <p className="text-xs text-ink/50 mt-1.5">{hint}</p>}
    </div>
  );
}

function HowToModal({ content, onClose }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4 py-6 overlay-in" style={{ background: "rgba(24,24,24,0.5)" }}>
      <div className="bg-card border-2 border-ink shadow-brut-lg max-w-lg w-full max-h-full flex flex-col">
        <div className="flex items-center justify-between p-5 border-b-2 border-ink">
          <h3 className="text-lg">{content.title}</h3>
          <button onClick={onClose} className="w-8 h-8 hover:bg-ink/5 flex items-center justify-center text-ink/60 font-black" aria-label="Close">✕</button>
        </div>
        <div className="overflow-y-auto p-6">
          <ol className="space-y-4">
            {content.steps.map((s, i) => (
              <li key={i} className="flex gap-3">
                <div className="w-7 h-7 bg-ink text-accent display font-black flex items-center justify-center flex-shrink-0 text-sm circle">{i + 1}</div>
                <div className="flex-1 pt-0.5 min-w-0">
                  <div className="text-sm font-semibold text-ink">{s[0]}</div>
                  {s[1] && <div className="text-sm text-ink/65 mt-0.5 leading-relaxed">{s[1]}</div>}
                  {s[2] && <img src={s[2]} alt="" className="mt-2 w-full max-w-xs border-2 border-ink" />}
                </div>
              </li>
            ))}
          </ol>
        </div>
        <div className="border-t-2 border-ink p-4 bg-paper">
          <button onClick={onClose} className="w-full display font-black text-xs uppercase tracking-widest bg-ink text-accent border-2 border-ink px-6 py-3 hover:bg-ink/90 transition-all">
            Got it
          </button>
        </div>
      </div>
    </div>
  );
}

// ============================================================================
// APP
// ============================================================================

const initialData = {
  clientName: "",
  clientEmail: "",
  agentName: "",
  telegramUserIds: [{ name: "", role: "", id: "" }],   // one or more; name + role are labels
  botToken: "",
  apiKey: "",
  extraSecrets: [],  // optional [{ label, secret }]
  consent: false,
};

// Optional: the Studio build this belongs to, passed in the link as ?ref=<build reference>.
// It's a random id (not personal data) and lets the keys record point at the saved build.
const BUILD_REF = (() => {
  const v = (new URLSearchParams(window.location.search).get("ref") || "").trim().toLowerCase();
  return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(v) ? v : "";
})();

function App() {
  const [data, setData] = useState(initialData);
  const [modal, setModal] = useState(null);
  const [phase, setPhase] = useState("form"); // form | submitting | done | error
  const [errorMsg, setErrorMsg] = useState("");
  const [showBot, setShowBot] = useState(false);
  const [showKey, setShowKey] = useState(false);
  const update = (patch) => setData(d => ({ ...d, ...patch }));

  // Telegram ID list helpers
  const setTgField = (i, field, val) => setData(d => {
    const next = d.telegramUserIds.map((p, x) => x === i ? { ...p, [field]: val } : p);
    return { ...d, telegramUserIds: next };
  });
  const addTgId = () => setData(d => ({ ...d, telegramUserIds: [...d.telegramUserIds, { name: "", role: "", id: "" }] }));
  const removeTgId = (i) => setData(d => ({ ...d, telegramUserIds: d.telegramUserIds.filter((_, x) => x !== i) }));

  // Optional extra secrets (label + value), encrypted individually like the rest.
  const addExtra = () => setData(d => ({ ...d, extraSecrets: [...d.extraSecrets, { label: "", secret: "" }] }));
  const setExtra = (i, patch) => setData(d => {
    const next = d.extraSecrets.map((row, x) => x === i ? { ...row, ...patch } : row);
    return { ...d, extraSecrets: next };
  });
  const removeExtra = (i) => setData(d => ({ ...d, extraSecrets: d.extraSecrets.filter((_, x) => x !== i) }));

  const valid = useMemo(() => {
    const tgOk = data.telegramUserIds.some(p => p.id.trim().length >= 3);
    // Extra secrets are optional and can be long, up to MAX_LONG_SECRET_BYTES.
    const extrasOk = data.extraSecrets.every(r => !r.secret.trim() || byteLen(r.secret) <= MAX_LONG_SECRET_BYTES);
    return (
      extrasOk &&
      data.clientName.trim().length >= 2 &&
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.clientEmail.trim()) &&
      data.agentName.trim().length >= 2 &&
      tgOk &&
      data.botToken.trim().length >= 10 &&
      data.apiKey.trim().length >= 10 &&
      data.consent === true
    );
  }, [data]);

  const slug = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

  const submit = async () => {
    if (!valid || phase === "submitting") return;
    setPhase("submitting");
    setErrorMsg("");
    try {
      // Collect the Telegram people who have an ID. The IDs are encrypted (comma-joined,
      // same format Tess already reads); the name + role travel as plaintext labels in the
      // SAME order, so each decrypted ID lines up with its person.
      const tgPeople = data.telegramUserIds.filter(p => p.id.trim());
      const tgList = tgPeople.map(p => p.id.trim()).join(", ");
      const tgLabels = tgPeople.map(p => ({ name: p.name.trim(), role: p.role.trim() }));

      // Encrypt the sensitive fields in the browser before anything leaves the page.
      const [encTgIds, encBot, encKey] = await Promise.all([
        encryptField(tgList),
        encryptField(data.botToken.trim()),
        encryptField(data.apiKey.trim()),
      ]);

      // Encrypt any extra secrets the client added (skipping blank rows).
      const filledExtras = data.extraSecrets.filter(r => r.secret.trim());
      const encExtras = [];
      for (const row of filledExtras) {
        encExtras.push({ label: row.label.trim(), enc_value: await encryptField(row.secret.trim()) });
      }

      const today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      const filename = `SNForge-${slug(data.clientName) || "client"}_${slug(data.agentName) || "agent"}_keys_${today}.txt`;

      // Same agent_setup_v2 intake the backend already files. This page only collects keys
      // and access details; the employee build itself was saved by the Studio.
      const payload = {
        kind: "agent_setup_v2",
        schema_version: SCHEMA_VERSION,
        encryption_key_id: KEY_ID,
        filename,
        source: "Secure keys page",
        agentType: "",
        clientName: data.clientName.trim(),
        client_email: data.clientEmail.trim(),
        companyName: data.clientName.trim(),   // names the Drive folder: <client> — <agent> (date)
        websites: "",
        timezone: "",
        agentName: data.agentName.trim(),
        commStyle: "",
        businessContext: "Keys and access details only. The employee build is in Studio Leads" +
          (BUILD_REF ? " under build reference " + BUILD_REF + "." : " (match by client name, email and agent name)."),
        existing_subscriptions: [],
        consent: data.consent === true,
        pfp_choice: "Chosen in the Studio build (not collected here)",
        pfp_id: "",
        pfp_name: "",
        ...(BUILD_REF ? { build_reference: BUILD_REF } : {}),
        // Who the Telegram IDs belong to (plaintext labels, aligned with the decrypted IDs).
        telegram_people: tgLabels,
        // encrypted (base64 RSA-OAEP ciphertext)
        enc_telegramUserIds: encTgIds,
        enc_botToken: encBot,
        enc_apiKey: encKey,
        extra_secrets: encExtras,   // [{ label, enc_value }] — same ENC format as the rest
        capturedAt: new Date().toString(),
      };

      // text/plain avoids a CORS preflight; Apps Script parses the body as JSON.
      await fetch(BACKEND_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
      });

      if (typeof confetti === "function") {
        confetti({ particleCount: 70, spread: 75, startVelocity: 45, gravity: 0.9, ticks: 200, origin: { x: 0.5, y: 0.5 }, colors: ["#3EB8C8", "#181818", "#BBB469", "#F7F3EA"] });
      }
      setPhase("done");
    } catch (e) {
      setErrorMsg(String(e));
      setPhase("error");
    }
  };

  if (phase === "done") {
    return <ThankYou data={data} />;
  }

  return (
    <div className="min-h-screen flex flex-col">
      <Header />
      <main className="flex-1 w-full max-w-2xl mx-auto px-6 py-10 md:py-14">
        <div className="mb-10">
          <div className="mono text-xs text-accent uppercase tracking-widest font-semibold mb-3 flex items-center gap-2">
            <span className="inline-block w-6 h-px bg-accent"></span>
            Secure Keys
          </div>
          <h1 className="text-3xl md:text-5xl mb-4">Add your keys.</h1>
          <p className="text-ink/75 text-base md:text-lg leading-relaxed">
            Your AI Employee is designed. This page collects the keys and access details we need to connect it. Each one has a step-by-step guide right next to it, and everything is encrypted in your browser before it's sent.
          </p>
          {BUILD_REF && <p className="mono text-[11px] text-ink/45 mt-3">Build reference: {BUILD_REF}</p>}
        </div>

        {/* Client name */}
        <Field label="Your name" required>
          <input type="text" value={data.clientName} onChange={e => update({ clientName: e.target.value })} placeholder="Jane Smith" className={inputClass} />
        </Field>

        {/* Email */}
        <Field label="Your email" required hint="So we can match these keys to your build.">
          <input type="email" value={data.clientEmail} onChange={e => update({ clientEmail: e.target.value })} placeholder="jane@acme.com" className={inputClass} />
        </Field>

        {/* Agent name */}
        <Field label="Your AI Employee's name" required hint="The name you chose in your build.">
          <input type="text" value={data.agentName} onChange={e => update({ agentName: e.target.value })} placeholder="Atlas" className={inputClass} />
        </Field>

        <div className="my-8 border-t-2 border-ink/10"></div>

        {/* Telegram User ID(s) */}
        <Field label="Your Telegram User ID" required howto="How to find this" onHowto={() => setModal("tgUserId")} hint="A ~10-digit number that tells your AI Employee who you are. Add more than one if a few people will share this AI Employee — the name and role help your AI Employee know who it's talking to.">
          <div className="space-y-4">
            {data.telegramUserIds.map((p, i) => (
              <div key={i} className="border-l-2 border-accent pl-4">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="mono text-[11px] uppercase tracking-widest font-semibold text-ink/60">{i === 0 ? "You" : "Person " + (i + 1)}</span>
                  {data.telegramUserIds.length > 1 && (
                    <button type="button" onClick={() => removeTgId(i)} className="mono text-[11px] text-ink/40 hover:text-[#C0392B] transition-colors">✕ remove</button>
                  )}
                </div>
                <div className="grid grid-cols-2 gap-2 mb-2">
                  <input type="text" value={p.name} onChange={e => setTgField(i, "name", e.target.value)} placeholder={i === 0 ? "Your name" : "Name (e.g. Jane)"} className={inputClass} />
                  <input type="text" value={p.role} onChange={e => setTgField(i, "role", e.target.value)} placeholder="Role (e.g. Manager)" className={inputClass} />
                </div>
                <input type="text" value={p.id} onChange={e => setTgField(i, "id", e.target.value)} placeholder={i === 0 ? "Telegram ID — 123456789" : "Their Telegram ID"} className={inputClass} />
              </div>
            ))}
          </div>
          <button type="button" onClick={addTgId} className="mono text-[11px] font-semibold uppercase tracking-widest text-accent hover:text-ink mt-3">
            + Add another person
          </button>
        </Field>


        {/* Bot token */}
        <Field label="Telegram Bot Token" required howto="How to create your bot" onHowto={() => setModal("botToken")} hint="🔒 Encrypted before it leaves this page.">
          <div className="relative">
            <input
              type={showBot ? "text" : "password"}
              value={data.botToken}
              onChange={e => update({ botToken: e.target.value })}
              placeholder="123456789:AAExampleTokenFromBotFather"
              className={inputClass + " pr-16"}
            />
            <button type="button" onClick={() => setShowBot(s => !s)} className="absolute right-3 top-1/2 -translate-y-1/2 mono text-[11px] uppercase tracking-widest text-ink/50 hover:text-ink">
              {showBot ? "Hide" : "Show"}
            </button>
          </div>
        </Field>

        {/* API key */}
        <Field label="OpenRouter API Key" required howto="How to get your key" onHowto={() => setModal("apiKey")} hint="🔒 Encrypted before it leaves this page.">
          <div className="relative">
            <input
              type={showKey ? "text" : "password"}
              value={data.apiKey}
              onChange={e => update({ apiKey: e.target.value })}
              placeholder="sk-or-v1-..."
              className={inputClass + " pr-16"}
            />
            <button type="button" onClick={() => setShowKey(s => !s)} className="absolute right-3 top-1/2 -translate-y-1/2 mono text-[11px] uppercase tracking-widest text-ink/50 hover:text-ink">
              {showKey ? "Hide" : "Show"}
            </button>
          </div>
        </Field>

        <div className="my-8 border-t-2 border-ink/10"></div>

        {/* Extra secrets — optional catch-all so nobody has to leave this page */}
        <Field
          label="Anything else we asked you for?"
          hint="Only if we asked. Another platform's API key, a login, a token — add it here so you don't have to leave this page. Long values like JSON keys are fine. Encrypted exactly like the fields above."
        >
          {data.extraSecrets.length > 0 && (
            <div className="space-y-4 mb-3">
              {data.extraSecrets.map((row, i) => {
                const n = byteLen(row.secret);
                const over = n > MAX_LONG_SECRET_BYTES;
                return (
                  <div key={i} className="border-l-2 border-accent pl-4">
                    <div className="flex items-center justify-between mb-1.5">
                      <span className="mono text-[11px] uppercase tracking-widest font-semibold text-ink/60">What is it?</span>
                      <button type="button" onClick={() => removeExtra(i)} className="mono text-[11px] text-ink/40 hover:text-[#C0392B] transition-colors">✕ remove</button>
                    </div>
                    <input
                      type="text"
                      value={row.label}
                      onChange={e => setExtra(i, { label: e.target.value })}
                      placeholder="e.g. Follow Up Boss API key"
                      className={inputClass + " mb-2"}
                    />
                    <div className="flex items-center justify-between mb-1.5">
                      <span className="mono text-[11px] uppercase tracking-widest font-semibold text-ink/60">The value</span>
                      <span className={`mono text-[11px] ${over ? "text-[#C0392B] font-semibold" : "text-ink/40"}`}>{n.toLocaleString()} / {MAX_LONG_SECRET_BYTES.toLocaleString()}</span>
                    </div>
                    <textarea
                      rows={4}
                      value={row.secret}
                      onChange={e => setExtra(i, { secret: e.target.value })}
                      placeholder="Paste it here"
                      className={inputClass + " mono resize-none " + (over ? "border-[#C0392B]" : "")}
                    />
                    {over && (
                      <p className="text-xs text-[#C0392B] mt-1.5">That's over the 8,000-character limit. Split it across two entries.</p>
                    )}
                  </div>
                );
              })}
            </div>
          )}
          <button
            type="button"
            onClick={addExtra}
            className="mono text-[11px] font-semibold uppercase tracking-widest text-accent hover:text-ink border-2 border-accent hover:border-ink px-4 py-2 transition-colors"
          >
            + Add {data.extraSecrets.length > 0 ? "another" : "a secret"}
          </button>
        </Field>

        {/* Submit */}
        <div className="mt-10 pt-6 border-t-2 border-ink">
          {/* Consent */}
          <label className="flex items-start gap-3 mb-6 cursor-pointer">
            <input
              type="checkbox"
              checked={data.consent}
              onChange={e => update({ consent: e.target.checked })}
              className="mt-0.5 w-5 h-5 flex-shrink-0"
            />
            <span className="text-sm text-ink/75 leading-relaxed">
              I authorize SN3 to use these details and credentials to set up my AI Employee.
            </span>
          </label>

          {phase === "error" && (
            <div className="mb-4 p-4 border-2 border-ink bg-accentSoft text-sm">
              <div className="font-semibold mb-1">Something went wrong submitting.</div>
              <div className="text-ink/70">Please try again in a moment. If it keeps happening, email info@sn3group.ai.</div>
            </div>
          )}
          <button
            onClick={submit}
            disabled={!valid || phase === "submitting"}
            className="w-full display font-black text-sm uppercase tracking-widest bg-accent text-ink border-2 border-ink px-6 py-4 shadow-brut hover:shadow-brut-hover hover:-translate-x-0.5 hover:-translate-y-0.5 active:translate-x-0 active:translate-y-0 active:shadow-brut-sm disabled:bg-ink/10 disabled:text-ink/30 disabled:shadow-none disabled:cursor-not-allowed disabled:hover:translate-x-0 disabled:hover:translate-y-0 transition-all flex items-center justify-center gap-3"
          >
            {phase === "submitting" ? (
              <>
                <svg className="spin-slow circle" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#181818" strokeWidth="3" strokeLinecap="round"><circle cx="12" cy="12" r="9" strokeDasharray="40 60" /></svg>
                Submitting...
              </>
            ) : "Send my keys →"}
          </button>
          <p className="text-xs text-ink/50 text-center mt-3">
            🔒 Your Telegram ID(s), bot token, and API key are encrypted in your browser before they're sent. Only the SN3 team can read them.
          </p>
        </div>
      </main>

      {modal && <HowToModal content={HOWTO[modal]} onClose={() => setModal(null)} />}
    </div>
  );
}

function Header() {
  return (
    <header className="border-b-2 border-ink bg-paper sticky top-0 z-40">
      <div className="max-w-2xl mx-auto px-6 py-4 flex items-center gap-3">
        <img src="sn3-logo.png" alt="SN3" className="h-9 w-auto block flex-shrink-0" />
        <div className="mono text-[10px] text-ink/60 uppercase tracking-widest font-semibold hidden sm:block">Secure Keys</div>
        <a href="quick-encrypt/" className="ml-auto text-right group leading-tight">
          <div className="mono text-[9px] text-ink/45 uppercase tracking-widest hidden sm:block">Need something quick?</div>
          <div className="mono text-[11px] font-semibold uppercase tracking-widest text-accent group-hover:text-ink transition-colors">🔐 Quick Encrypt →</div>
        </a>
      </div>
    </header>
  );
}

function ThankYou({ data }) {
  const agent = data.agentName || "your AI Employee";
  const first = data.clientName ? `, ${data.clientName.split(" ")[0]}` : "";

  return (
    <div className="min-h-screen flex flex-col">
      <Header />
      <main className="flex-1 flex flex-col items-center px-6 py-16">
        <div className="max-w-lg text-center fade-in">
          <div className="w-20 h-20 bg-ink text-accent border-2 border-ink shadow-brut mx-auto mb-8 flex items-center justify-center display font-black text-4xl scale-in circle">✓</div>
          <div className="mono text-xs text-accent uppercase tracking-widest font-semibold mb-3">Keys received</div>
          <h1 className="text-3xl md:text-4xl mb-4">You're all set{first}.</h1>
          <p className="text-ink/75 text-base md:text-lg leading-relaxed mb-8">
            We've got what we need to connect <span className="serif italic font-semibold">{agent}</span>. Your keys were encrypted before they left this page. You can close this tab and head back to your call.
          </p>
          <p className="text-xs text-ink/50 mt-10">Questions? Reach us anytime at info@sn3group.ai.</p>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
