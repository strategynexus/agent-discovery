<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Strategy Ninjas — Agent Launch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;0,900;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    corePlugins: { preflight: true },
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
          serif: ['"Source Serif 4"', 'Georgia', 'serif'],
          mono: ['JetBrains Mono', 'monospace'],
        },
        colors: {
          ink: '#181818', paper: '#F7F3EA', card: '#FFFFFF', darkCard: '#101010',
          accent: '#3EB8C8', accentSoft: '#E8F6F8', gold: '#BBB469',
        },
        boxShadow: {
          brut: '6px 6px 0 0 #181818', 'brut-sm': '4px 4px 0 0 #181818',
          'brut-lg': '14px 14px 0 0 #181818', 'brut-hover': '8px 8px 0 0 #181818',
        },
        borderRadius: { DEFAULT: '0', none: '0', sm: '0', md: '0', lg: '0', xl: '0', '2xl': '0', full: '0' },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', sans-serif; background: #F7F3EA; color: #181818; -webkit-font-smoothing: antialiased; }
  .display { font-family: 'Space Grotesk', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .serif { font-family: 'Source Serif 4', Georgia, serif; }
  h1, h2, h3 { font-family: 'Source Serif 4', Georgia, serif; font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em; line-height: 0.95; }
  h1 { letter-spacing: -0.02em; line-height: 0.94; }
  button, input, textarea, select, .card, [class*="rounded"] { border-radius: 0 !important; }
  .circle { border-radius: 9999px !important; }
  ::selection { background: #3EB8C8; color: #181818; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease-out; }
  @keyframes scaleIn { 0% { transform: scale(0.3); opacity: 0; } 60% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
  .scale-in { animation: scaleIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes spin-slow { to { transform: rotate(360deg); } }
  .spin-slow { animation: spin-slow 1.2s linear infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useEffect } = React;

// ============================================================================
// CONFIG
// ============================================================================
const BACKEND_URL = "https://script.google.com/macros/s/AKfycbwlDjUnvf-2SSI-vVdIUaWNDHyC3z4OLWmbzFPWwLQx9PXTp59s5q1pgFX4eaRt8aZY/exec";
const SCHEMA_VERSION = "launch_v1";

const PAYMENT_URL = "https://link.fastpaydirect.com/payment-link/6a221e5f71a0aa761e4631af";
const SUPPORT_EMAIL = "info@thestrategyninjas.com";
const SUPPORT_URL = "https://support.strategyninjas.ai/ai-employee-support-page";
const PFP_FOLDER_URL = "https://drive.google.com/drive/folders/1cFjXQI21bu1PAIi60LWj_sEsIJ_sNB7g";

// Feature/command guide, picked by agent type. "Other" uses the COS guide.
// (Files were updated in place in Drive, so these ids stay current.)
const SHEETS = {
  "Chief of Staff":          "https://drive.google.com/file/d/1TM7xYFUuKNct87K7oAN68QMi_6MUUyrx/view",
  "Transaction Coordinator": "https://drive.google.com/file/d/1GdHpeMgOoYxGmJOC-jljjqW88BPLcScB/view",
  "Other":                   "https://drive.google.com/file/d/1TM7xYFUuKNct87K7oAN68QMi_6MUUyrx/view",
};

const AGENT_TYPES = ["Chief of Staff", "Transaction Coordinator", "Other"];

// What /onboard walks through (kept high level — the agent drives the detail).
const ONBOARD_COVERS = [
  ["Goals & responsibilities", "What you want help with first, so it focuses on real work instead of a generic tour."],
  ["Provider & default setup", "You can usually continue with the defaults and decide on options later."],
  ["Tool connections", "What to connect first — it generates secure connection links when available."],
  ["Learn your world (read-only)", "It may ask permission to review limited context from connected apps before changing anything."],
  ["Your preferences", "Tone, priorities, and recurring workflows it can remember with your OK."],
  ["Workspace or dashboard (optional)", "It may offer to build one once it understands your goals — never forced."],
  ["Automations (optional)", "It asks before creating anything recurring — what, when, and where."],
  ["A first useful task", "It helps you actually get something done, not just finish setup."],
];

const SPIN_EXAMPLES = [
  "What can you help me with based on our setup so far?",
  "Help me organize my priorities for this week.",
  "Draft a follow-up email from these notes.",
  "Create a checklist for this project.",
  "If my calendar is connected, summarize my week.",
];

const CAPABILITIES = [
  "Summarize information",
  "Draft emails, proposals, checklists, reports, and notes",
  "Research public information",
  "Organize priorities and tasks",
  "Prepare meetings and follow-ups",
  "Connect to approved apps through secure links",
  "Create reminders or recurring automations (with your permission)",
  "Troubleshoot safely when something gets stuck",
];

const ASKS = [
  "What should I focus on today?",
  "Help me organize my priorities.",
  "Draft a reply from these notes.",
  "Create a checklist for this project.",
  "Summarize this document.",
  "What can you do now that this tool is connected?",
];

const AUTOMATIONS = [
  "Morning briefing",
  "End-of-day summary",
  "Weekly review",
  "Follow-up reminders",
  "Scheduled reports",
  "Monitoring tasks",
];

const COMMANDS = [
  ["/start", "First-time wake-up / start button in Telegram."],
  ["/onboard", "Guided setup and first-use flow."],
  ["/connect", "Connect apps and tools through secure links."],
  ["/automations", "Set up recurring tasks and schedules (with your consent)."],
  ["/figureitout", "Troubleshoot a problem and try safe alternatives."],
  ["/capabilities", "See what your AI Employee can do."],
  ["/status", "Quick health / status check."],
  ["/support", "Get Strategy Ninjas support information."],
  ["/new", "Start a fresh conversation."],
  ["/restart", "Refresh or recover if something feels stuck."],
  ["/stop", "Cancel the current task."],
  ["/queue", "Check queued messages or tasks."],
  ["/voice", "Control voice input / output."],
  ["/model", "Manage provider / model options where supported."],
  ["/help", "Plain-language help."],
];

const STATUS_MSGS = [
  {
    msg: "“Working — starting API call”",
    meaning: "Your AI Employee is still processing. Longer research, writing, or planning can take several requests.",
    todo: "Wait if the task matters. Send /stop if you want to cancel.",
  },
  {
    msg: "“No activity for 3 min… timed out in 7 min…”",
    meaning: "The system hasn't seen visible progress for a few minutes. The task may still be running. It's a timeout-protection warning — not data loss.",
    todo: "Wait a little longer if it matters, or send /stop, /restart, or ask it to take a simpler approach.",
  },
  {
    msg: "“Context compression aborted… No messages were dropped”",
    meaning: "The conversation got long and the system tried to tidy older context. The attempt stopped — but nothing was lost and the conversation is unchanged.",
    todo: "Usually nothing. Send /new if the conversation feels too long or tangled.",
  },
];

// ============================================================================
// SMALL PIECES
// ============================================================================

const inputClass = "w-full px-4 py-3 bg-card border-2 border-ink/25 focus:border-ink focus:outline-none focus:shadow-brut-sm transition-all text-sm placeholder:text-ink/30";

// Copyable command / phrase.
function Cmd({ text, note }) {
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(text); }
    catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); }
    setCopied(true); setTimeout(() => setCopied(false), 1400);
  };
  return (
    <div className="flex flex-wrap items-center gap-2">
      <code className="mono text-sm bg-ink text-accent px-3 py-2 border-2 border-ink">{text}</code>
      <button onClick={copy} className={`mono text-[11px] uppercase tracking-widest font-semibold border-2 border-ink px-3 py-2 transition-colors ${copied ? "bg-accent text-ink" : "hover:bg-ink hover:text-paper"}`}>
        {copied ? "Copied ✓" : "Copy"}
      </button>
      {note && <span className="text-sm text-ink/60">{note}</span>}
    </div>
  );
}

function Step({ n, title, blurb, children }) {
  return (
    <section data-step={n} className="border-2 border-ink bg-card shadow-brut mb-5">
      <header className="flex items-start gap-3 p-5 border-b-2 border-ink/10">
        <div className="w-9 h-9 flex-shrink-0 flex items-center justify-center display font-black circle border-2 border-ink bg-ink text-accent">{n}</div>
        <div className="flex-1 min-w-0">
          <h2 className="text-xl md:text-2xl">{title}</h2>
          {blurb && <p className="text-sm text-ink/70 mt-1.5 leading-relaxed">{blurb}</p>}
        </div>
      </header>
      <div className="p-5">{children}</div>
    </section>
  );
}

function Header() {
  return (
    <header className="border-b-2 border-ink bg-paper sticky top-0 z-40">
      <div className="max-w-3xl mx-auto px-6 py-4 flex items-center gap-3">
        <img src="../sn-logo.png" alt="Strategy Ninjas" className="h-9 w-auto block flex-shrink-0" />
        <div className="mono text-[10px] text-ink/60 uppercase tracking-widest font-semibold hidden sm:block">Agent Launch</div>
      </div>
    </header>
  );
}

// ============================================================================
// APP
// ============================================================================

const TOTAL_STEPS = 11;

function App() {
  const [setup, setSetup] = useState({ clientName: "", clientEmail: "", agentName: "", agentType: "" });
  const [generated, setGenerated] = useState(false);
  const [curStep, setCurStep] = useState(1);
  const [initials, setInitials] = useState("");
  const [phase, setPhase] = useState("run"); // run | submitting | complete | error
  const [errorMsg, setErrorMsg] = useState("");

  const up = (patch) => setSetup(s => ({ ...s, ...patch }));

  // Scroll-driven "Step N of 11" — no clicks required.
  useEffect(() => {
    if (!generated) return;
    const onScroll = () => {
      const secs = [...document.querySelectorAll("section[data-step]")];
      let n = 1;
      for (const s of secs) { if (s.getBoundingClientRect().top <= 160) n = Number(s.dataset.step); }
      setCurStep(n);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, [generated]);

  const setupOk = setup.clientName.trim().length >= 2 && setup.agentName.trim().length >= 2 &&
                  /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(setup.clientEmail.trim()) && setup.agentType;

  const agent = setup.agentName.trim() || "your agent";
  const client = setup.clientName.trim() || "there";
  const canSign = initials.trim().length >= 2;

  const generate = () => {
    if (!setupOk) return;
    setGenerated(true);
    setTimeout(() => { const el = document.getElementById("runofshow"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 60);
  };

  const submit = async () => {
    if (!canSign || phase === "submitting") return;
    setPhase("submitting"); setErrorMsg("");
    try {
      const today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
      const slug = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
      const payload = {
        kind: "launch_v1",
        schema_version: SCHEMA_VERSION,
        filename: `Launch-${slug(setup.clientName) || "client"}_${slug(setup.agentName) || "agent"}_${today}.txt`,
        clientName: setup.clientName.trim(),
        clientEmail: setup.clientEmail.trim(),
        agentName: setup.agentName.trim(),
        agentType: setup.agentType,
        initials: initials.trim().toUpperCase(),
        capturedAt: new Date().toString(),
      };
      await fetch(BACKEND_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
      if (typeof confetti === "function") {
        confetti({ particleCount: 120, spread: 90, startVelocity: 48, gravity: 0.9, ticks: 240, origin: { x: 0.5, y: 0.5 }, colors: ["#3EB8C8", "#181818", "#BBB469", "#F7F3EA"] });
      }
      setPhase("complete");
      window.scrollTo({ top: 0, behavior: "smooth" });
    } catch (e) { setErrorMsg(String(e)); setPhase("error"); }
  };

  if (phase === "complete") {
    return (
      <div className="min-h-screen flex flex-col">
        <Header />
        <main className="flex-1 flex flex-col items-center px-6 py-20">
          <div className="max-w-lg text-center fade-in">
            <div className="w-20 h-20 bg-ink text-accent border-2 border-ink shadow-brut mx-auto mb-8 flex items-center justify-center display font-black text-4xl scale-in circle">✓</div>
            <div className="mono text-xs text-accent uppercase tracking-widest font-semibold mb-3">Launched</div>
            <h1 className="text-4xl mb-4">{agent} is live.</h1>
            <p className="text-ink/75 text-lg leading-relaxed mb-8">
              Nice work, {client}. You've met your AI Employee, started guided onboarding, and you know how to keep building from here. Any remaining tool connections, workspace setup, or automations can be done with your AI Employee whenever you're ready. Your confirmation and guide are on their way to <span className="font-semibold text-ink">{setup.clientEmail.trim()}</span>.
            </p>
            <div className="bg-card border-2 border-ink shadow-brut p-6 text-left">
              <div className="mono text-xs text-ink/60 uppercase tracking-widest font-semibold mb-3">From here</div>
              <ul className="text-sm text-ink/80 space-y-2 list-disc list-inside">
                <li>Message your AI Employee in Telegram like a teammate.</li>
                <li>Send <span className="mono font-semibold">/onboard</span> to resume setup, <span className="mono font-semibold">/connect</span> to add tools.</li>
                <li>Send <span className="mono font-semibold">/figureitout</span> if something gets stuck.</li>
                <li>For billing, access, or new-tool requests, <a href={SUPPORT_URL} target="_blank" rel="noopener noreferrer" className="underline hover:text-accent font-semibold">open a support ticket →</a></li>
              </ul>
            </div>
          </div>
        </main>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex flex-col">
      <Header />

      {generated && (
        <div className="sticky top-[65px] z-30 bg-paper border-b-2 border-ink/10">
          <div className="max-w-3xl mx-auto px-6 py-2.5 flex items-center gap-3">
            <div className="flex-1 h-2 bg-ink/10 border border-ink/20">
              <div className="h-full bg-accent transition-all" style={{ width: `${(curStep / TOTAL_STEPS) * 100}%` }}></div>
            </div>
            <div className="mono text-[11px] font-semibold text-ink/60 whitespace-nowrap">Step {curStep} of {TOTAL_STEPS}</div>
          </div>
        </div>
      )}

      <main className="flex-1 w-full max-w-3xl mx-auto px-6 py-10 md:py-14">
        <div className="mb-10">
          <div className="mono text-xs text-accent uppercase tracking-widest font-semibold mb-3 flex items-center gap-2">
            <span className="inline-block w-6 h-px bg-accent"></span> Agent Launch
          </div>
          <h1 className="text-4xl md:text-6xl mb-4">Launch day.</h1>
          <p className="text-ink/75 text-base md:text-lg leading-relaxed">
            Today we'll introduce you to your AI Employee, start guided onboarding, review the core commands, and show you how to keep building from there. Start by telling us who we're launching.
          </p>
        </div>

        {/* LIGHT SETUP */}
        <section className="border-2 border-ink bg-card shadow-brut p-6 mb-10">
          <div className="mono text-xs text-ink/60 uppercase tracking-widest font-semibold mb-5">Quick setup</div>
          <div className="grid sm:grid-cols-2 gap-4">
            <div>
              <label className="block mono text-[11px] font-semibold uppercase tracking-widest text-ink/80 mb-2">Your first name <span className="text-accent">*</span></label>
              <input type="text" value={setup.clientName} onChange={e => up({ clientName: e.target.value })} placeholder="Mike" className={inputClass} />
            </div>
            <div>
              <label className="block mono text-[11px] font-semibold uppercase tracking-widest text-ink/80 mb-2">Your agent's name <span className="text-accent">*</span></label>
              <input type="text" value={setup.agentName} onChange={e => up({ agentName: e.target.value })} placeholder="Atlas" className={inputClass} />
            </div>
          </div>

          <div className="mt-5">
            <label className="block mono text-[11px] font-semibold uppercase tracking-widest text-ink/80 mb-2">Your email <span className="text-accent">*</span></label>
            <input type="email" value={setup.clientEmail} onChange={e => up({ clientEmail: e.target.value })} placeholder="mike@company.com" className={inputClass} />
            <p className="text-xs text-ink/50 mt-1.5">We'll send your launch confirmation and guide here.</p>
          </div>

          <div className="mt-5">
            <label className="block mono text-[11px] font-semibold uppercase tracking-widest text-ink/80 mb-2">Agent type <span className="text-accent">*</span></label>
            <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
              {AGENT_TYPES.map(t => (
                <button key={t} type="button" onClick={() => up({ agentType: t })}
                  className={`text-sm px-3 py-3 border-2 transition-all font-medium ${setup.agentType === t ? "bg-ink text-paper border-ink" : "bg-card border-ink/25 hover:border-ink hover:bg-accentSoft"}`}>
                  {t}
                </button>
              ))}
            </div>
          </div>

          {/* Pre-flight */}
          <div className="mt-6 border-2 border-ink bg-accentSoft p-5">
            <div className="mono text-[11px] uppercase tracking-widest font-semibold text-ink/70 mb-3">Before we start</div>
            <ul className="text-sm text-ink/80 space-y-2.5 list-disc list-inside">
              <li>Open <span className="font-semibold">Telegram</span> and find your AI Employee.</li>
              <li>Make sure you can log into any app accounts you might want to connect today.</li>
              <li>No need to prepare anything — your AI Employee guides setup with <span className="mono font-semibold">/onboard</span>.</li>
            </ul>
          </div>

          <button onClick={generate} disabled={!setupOk}
            className="mt-6 w-full display font-black text-sm uppercase tracking-widest bg-accent text-ink border-2 border-ink px-6 py-4 shadow-brut hover:shadow-brut-hover hover:-translate-x-0.5 hover:-translate-y-0.5 disabled:bg-ink/10 disabled:text-ink/30 disabled:shadow-none disabled:cursor-not-allowed disabled:hover:translate-x-0 disabled:hover:translate-y-0 transition-all">
            {generated ? "↻ Regenerate" : "Start launch walkthrough →"}
          </button>
        </section>

        {!generated && (
          <p className="text-center text-sm text-ink/45 mb-10">Fill in the setup above and hit start — your walkthrough appears here.</p>
        )}

        {generated && (
          <div id="runofshow" className="fade-in">

            <Step n={1} title={`Meet ${agent}`}
              blurb="Open Telegram and say hello. Your AI Employee will respond and guide the next step — no long prompts to paste.">
              <Cmd text="/start" note="or just say: “Hi, I’m ready to get set up.”" />
            </Step>

            <Step n={2} title="Start guided onboarding"
              blurb="This is the core of setup. Your AI Employee walks you through it directly — you don't paste a launch script.">
              <Cmd text="/onboard" />
              <div className="mt-4 mono text-[11px] uppercase tracking-widest font-semibold text-ink/60 mb-3">What it covers</div>
              <div className="space-y-2">
                {ONBOARD_COVERS.map(([t, d]) => (
                  <div key={t} className="flex gap-3 border-2 border-ink/15 bg-paper p-3">
                    <div className="w-1.5 flex-shrink-0 bg-accent"></div>
                    <div className="min-w-0">
                      <div className="text-sm font-semibold text-ink">{t}</div>
                      <div className="text-xs text-ink/65 leading-relaxed mt-0.5">{d}</div>
                    </div>
                  </div>
                ))}
              </div>
              <p className="text-sm text-ink/60 mt-4">You can skip, pause, or resume onboarding anytime by sending <span className="mono font-semibold">/onboard</span> again.</p>
            </Step>

            <Step n={3} title="Connect your tools"
              blurb="When you're ready to link an app, your AI Employee sends a secure connection link. Connect what you want, in the order you want.">
              <Cmd text="/connect" note="or just ask: “Can you help me connect [tool]?”" />
              <ul className="text-sm text-ink/80 space-y-2 list-disc list-inside mt-4">
                <li>Connections happen through <span className="font-semibold">secure links</span> — never paste passwords or raw tokens into chat.</li>
                <li>Your AI Employee won't claim a tool is connected until it verifies the connection.</li>
                <li>Most common tools connect through a link. If one needs extra setup, your AI Employee or Strategy Ninjas will explain the next step.</li>
              </ul>
            </Step>

            <Step n={4} title="Take it for a spin"
              blurb="Ask your AI Employee to do one useful, low-risk thing while we're on the call. A few ideas:">
              <div className="border-2 border-ink bg-accentSoft p-4">
                <div className="grid gap-2">
                  {SPIN_EXAMPLES.map(q => (
                    <div key={q} className="text-sm text-ink/80 leading-snug"><span className="text-accent font-bold mr-1.5">›</span>{q}</div>
                  ))}
                </div>
              </div>
            </Step>

            <Step n={5} title={`Give ${agent} a face`}
              blurb="If you picked a face at signup, set it now. If not, grab one from the library.">
              <div className="bg-accentSoft border-2 border-ink p-4">
                <div className="mono text-[11px] text-ink/70 uppercase tracking-widest font-semibold mb-3">Two ways to set it</div>
                <div className="mb-3">
                  <div className="text-sm font-semibold text-ink mb-1">Right on your bot (fastest)</div>
                  <p className="text-sm text-ink/80">Open your bot's chat, tap its name at the top to open its profile, tap <span className="font-semibold">Edit</span>, then tap the photo icon and upload the image.</p>
                </div>
                <div className="border-t border-ink/15 pt-3">
                  <div className="text-sm font-semibold text-ink mb-1">Or through @BotFather</div>
                  <p className="text-sm text-ink/80">Message <span className="mono font-semibold">@BotFather</span>, send <span className="mono font-semibold">/setuserpic</span>, choose your bot, and upload the image.</p>
                </div>
              </div>
              <p className="text-sm text-ink/60 mt-3">Need a picture? <a href={PFP_FOLDER_URL} target="_blank" rel="noopener noreferrer" className="underline hover:text-accent font-semibold">Browse the face library →</a></p>
            </Step>

            <Step n={6} title={`What ${agent} can do`}
              blurb="The tour — what it helps with, what to actually say to it, and the automations it can set up with your OK.">

              <div className="mono text-[11px] uppercase tracking-widest font-semibold text-ink/60 mb-3">What it helps with</div>
              <div className="grid sm:grid-cols-2 gap-2.5">
                {CAPABILITIES.map(c => (
                  <div key={c} className="text-sm text-ink/80 border-2 border-ink/15 bg-paper p-3 leading-snug">{c}</div>
                ))}
              </div>

              <div className="mono text-[11px] uppercase tracking-widest font-semibold text-ink/60 mt-6 mb-3">Things to try asking</div>
              <div className="border-2 border-ink bg-accentSoft p-4">
                <div className="grid sm:grid-cols-2 gap-x-5 gap-y-2">
                  {ASKS.map(q => (
                    <div key={q} className="text-sm text-ink/80 leading-snug"><span className="text-accent font-bold mr-1.5">›</span>{q}</div>
                  ))}
                </div>
                <p className="text-xs text-ink/55 mt-4 pt-3 border-t border-ink/15">No special commands needed — talk to {agent} in plain English, like a teammate.</p>
              </div>

              <div className="mono text-[11px] uppercase tracking-widest font-semibold text-ink/60 mt-6 mb-3">Automations, if you want them</div>
              <div className="border-2 border-ink/15 bg-paper p-4">
                <div className="flex flex-wrap gap-2 mb-3">
                  {AUTOMATIONS.map(a => (
                    <span key={a} className="text-sm text-ink/80 bg-card border-2 border-ink/20 px-3 py-1.5">{a}</span>
                  ))}
                </div>
                <p className="text-sm text-ink/70 leading-relaxed">Your AI Employee can set up recurring briefings, reminders, or summaries. It'll ask what you want, when you want it, and where it should be delivered before creating anything recurring.</p>
              </div>

              {setup.agentType && (
                <a href={SHEETS[setup.agentType]} target="_blank" rel="noopener noreferrer"
                  className="mt-4 inline-block mono text-[11px] uppercase tracking-widest font-semibold text-accent hover:text-ink underline decoration-2 underline-offset-2">
                  Open the full guide →
                </a>
              )}
            </Step>

            <Step n={7} title="Useful commands"
              blurb="Type these in Telegram anytime. Tap any to copy.">
              <div className="grid sm:grid-cols-2 gap-2.5">
                {COMMANDS.map(([c, d]) => (
                  <div key={c} className="border-2 border-ink/15 bg-paper p-3">
                    <code className="mono text-sm font-semibold text-ink">{c}</code>
                    <div className="text-xs text-ink/65 leading-relaxed mt-1">{d}</div>
                  </div>
                ))}
              </div>
            </Step>

            <Step n={8} title="Messages that look scary but usually aren’t"
              blurb="Telegram will sometimes show system status notices. Here's what the common ones mean.">
              <div className="space-y-3">
                {STATUS_MSGS.map((s) => (
                  <div key={s.msg} className="border-2 border-ink/15 bg-paper p-4">
                    <div className="mono text-sm font-semibold text-ink mb-1.5">{s.msg}</div>
                    <p className="text-sm text-ink/70 leading-relaxed"><span className="font-semibold text-ink">What it means: </span>{s.meaning}</p>
                    <p className="text-sm text-ink/70 leading-relaxed mt-1"><span className="font-semibold text-ink">What to do: </span>{s.todo}</p>
                  </div>
                ))}
              </div>
              <div className="mt-4 border-2 border-ink bg-ink text-paper p-5">
                <div className="mono text-[11px] uppercase tracking-widest font-semibold text-accent mb-2">If something gets stuck</div>
                <p className="text-sm text-paper/85 leading-relaxed">
                  Send <span className="mono font-semibold text-paper">/figureitout</span>. Your AI Employee will diagnose the issue, try safe non-destructive fixes, look for another path, and keep going if it can. It always asks first before anything risky, paid, destructive, or before sending an external message.
                </p>
              </div>
              <p className="text-sm text-ink/55 mt-3">Unsure about a message? Just ask your AI Employee what happened, or send <span className="mono font-semibold">/figureitout</span>.</p>
            </Step>

            <Step n={9} title="What to expect early on"
              blurb="The first few days are a calibration period.">
              <p className="text-sm text-ink/75 leading-relaxed">
                Correct {agent} when its tone, priorities, or assumptions are off — clear feedback is exactly how it adapts to how you work. It also picks up new skills and tool connections over time as your needs change.
              </p>
              <p className="text-sm text-ink/70 leading-relaxed mt-3">
                Handy anytime: <span className="mono font-semibold">/new</span> for a fresh topic, <span className="mono font-semibold">/stop</span> to cancel work, and <span className="mono font-semibold">/figureitout</span> when something gets stuck.
              </p>
            </Step>

            <Step n={10} title="Your subscription"
              blurb="Set up your managed service so your AI Employee keeps running after launch.">
              <a href={PAYMENT_URL} target="_blank" rel="noopener noreferrer"
                className="block w-full text-center display font-black text-sm uppercase tracking-widest bg-ink text-accent border-2 border-ink px-6 py-4 shadow-brut hover:bg-accent hover:text-ink transition-all">
                Set up my subscription →
              </a>
              <p className="text-xs text-ink/50 mt-3">Opens our secure payment page in a new tab. Come back here when you're done.</p>
            </Step>

            <Step n={11} title="Getting support"
              blurb="For everyday work, just ask your AI Employee. For billing, access issues, broken integrations, or new-tool requests that need Strategy Ninjas — use the support desk.">
              <div className="border-2 border-ink bg-card p-6 text-center">
                <div className="mono text-[11px] uppercase tracking-widest font-semibold text-accent mb-2">Support desk</div>
                <p className="text-sm text-ink/75 leading-relaxed mb-5 max-w-md mx-auto">
                  Bookmark it now so it's always one click away, then open a ticket whenever you need something.
                </p>
                <a href={SUPPORT_URL} target="_blank" rel="noopener noreferrer"
                  className="inline-block display font-black text-sm uppercase tracking-widest bg-ink text-accent border-2 border-ink px-8 py-4 shadow-brut hover:bg-accent hover:text-ink transition-all">
                  Bookmark our support page →
                </a>
                <p className="text-xs text-ink/50 mt-4">Prefer email? Reach us at <a href={`mailto:${SUPPORT_EMAIL}`} className="underline hover:text-accent">{SUPPORT_EMAIL}</a>.</p>
              </div>
            </Step>

            {/* SIGN OFF */}
            <section className="border-2 border-ink bg-darkCard text-paper shadow-brut p-6 md:p-8 mt-10">
              <div className="mono text-xs text-accent uppercase tracking-widest font-semibold mb-3">Sign off</div>
              <h2 className="text-2xl md:text-3xl text-paper mb-3">All set?</h2>
              <p className="text-paper/70 text-sm leading-relaxed mb-6">
                Pop your initials below to confirm we introduced {agent}, started guided onboarding, reviewed the command menu, and showed you where to get support. We'll send your confirmation and full guide to {setup.clientEmail.trim() || "your email"}.
              </p>

              <div className="flex flex-col sm:flex-row gap-3">
                <input type="text" value={initials} onChange={e => setInitials(e.target.value.slice(0, 5))} placeholder="Your initials" maxLength={5}
                  className="flex-1 px-4 py-4 bg-paper text-ink border-2 border-paper focus:outline-none display font-black text-center text-xl uppercase tracking-[0.3em] placeholder:text-ink/25 placeholder:tracking-normal placeholder:font-normal placeholder:text-sm" />
                <button onClick={submit} disabled={!canSign || phase === "submitting"}
                  className="display font-black text-sm uppercase tracking-widest bg-accent text-ink border-2 border-accent px-8 py-4 hover:bg-paper hover:border-paper disabled:bg-paper/20 disabled:border-paper/20 disabled:text-paper/40 disabled:cursor-not-allowed transition-all flex items-center justify-center gap-3">
                  {phase === "submitting" ? (
                    <>
                      <svg className="spin-slow circle" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#181818" strokeWidth="3" strokeLinecap="round"><circle cx="12" cy="12" r="9" strokeDasharray="40 60" /></svg>
                      Confirming...
                    </>
                  ) : "Confirm launch →"}
                </button>
              </div>

              {phase === "error" && (
                <div className="mt-4 border-2 border-gold bg-gold/10 p-3 text-sm text-paper/85">
                  Something went wrong sending that. Try again in a moment — if it keeps happening, email {SUPPORT_EMAIL}.
                </div>
              )}
            </section>
          </div>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
